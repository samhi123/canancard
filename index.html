<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迦南科技管理部 - 行動打卡系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.liff.line.me/edge/2/sdk.js"></script>
    <script src="env.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <nav class="bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-md">
                員
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <span id="current-user-name" class="font-bold text-slate-800 text-base">載入中...</span>
                    <span id="current-user-office" class="bg-indigo-50 text-indigo-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">---</span>
                </div>
                <p class="text-xs text-slate-400 mt-0.5">工號: <span id="current-user-id" class="font-mono font-medium">---</span> · 行動端打卡</p>
            </div>
        </div>
        <button onclick="window.location.reload()" class="text-xs text-slate-400 hover:text-slate-600 font-medium transition-colors">
            <i class="fa-solid fa-right-from-bracket"></i> 登出
        </button>
    </nav>

    <div id="loading-view" class="fixed inset-0 bg-slate-900/10 backdrop-blur-xs flex flex-col justify-center items-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center">
            <i class="fa-solid fa-spinner animate-spin text-3xl text-indigo-600 mb-3"></i>
            <p class="text-sm font-semibold text-slate-700">正在安全驗證登入環境...</p>
            <p class="text-[10px] text-slate-400 mt-1">智慧差勤 · 雲端同步</p>
        </div>
    </div>

    <div id="password-login-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-40 px-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-100">
            <div class="text-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">員工外網安全登入</h3>
                <p class="text-xs text-slate-400 mt-0.5">系統偵測到非 LINE 環境，請輸入工號密碼</p>
            </div>
            <form onsubmit="handlePasswordLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">員工工號</label>
                    <input type="text" id="login-empId" required placeholder="例如: 001" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                    <input type="password" id="login-password" required placeholder="初始密碼預設為工號" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-semibold text-sm transition-all">
                    驗證登入
                </button>
            </form>
        </div>
    </div>

    <main class="flex-1 max-w-md w-full mx-auto px-4 py-6 space-y-6">
        
        <div id="punch-section" class="bg-white rounded-2xl p-6 shadow-md border border-slate-100 text-center space-y-4">
            <div class="flex justify-between items-center bg-slate-50 px-4 py-2 rounded-xl text-xs">
                <span class="text-slate-500">安全認證模式：</span>
                <span id="login-mode-tag" class="font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">LINE 自動登入</span>
            </div>

            <div class="bg-slate-900 text-emerald-400 rounded-xl py-4 font-mono shadow-inner">
                <div id="clock-time" class="text-3xl font-bold tracking-wider">00:00:00</div>
                <div id="clock-date" class="text-xs text-slate-400 mt-1">2026年06月14日</div>
            </div>

            <div>
                <input type="text" id="punch-memo" placeholder="打卡備註說明 (選填)..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500 text-center">
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2">
                <button onclick="submitPunch('上班')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-sun"></i> <span>上班打卡</span>
                </button>
                <button onclick="submitPunch('下班')" class="bg-slate-700 hover:bg-slate-800 text-white py-3 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-moon"></i> <span>下班打卡</span>
                </button>
            </div>
        </div>

        <div id="form-section" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
            <h4 class="text-xs font-bold text-slate-500 px-1 tracking-wider uppercase">表單線上申請</h4>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openApplicationForm('leave')" id="leave-apply-btn" class="flex flex-col items-center justify-center p-4 bg-slate-50 hover:bg-indigo-50/50 border border-slate-100 rounded-xl transition-all group">
                    <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-lg shadow-xs">
                        <i class="fa-solid fa-calendar-minus"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700 mt-2">請假申請</span>
                </button>
                <button onclick="openApplicationForm('overtime')" id="overtime-apply-btn" class="flex flex-col items-center justify-center p-4 bg-slate-50 hover:bg-indigo-50/50 border border-slate-100 rounded-xl transition-all group">
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-lg shadow-xs">
                        <i class="fa-solid fa-user-clock"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700 mt-2">加班申請</span>
                </button>
            </div>
        </div>

        <div id="admin-link-box" class="hidden bg-linear-to-r from-slate-900 to-indigo-950 rounded-2xl p-4 text-white flex justify-between items-center shadow-md">
            <div>
                <p class="text-xs font-bold tracking-wide">偵測到最高管理員權限</p>
                <p class="text-[10px] text-slate-400 mt-0.5">您可以跨所查看所有員工差勤數據</p>
            </div>
            <a href="admin.html" class="bg-white text-slate-900 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-slate-100 transition-colors">
                進入後台 <i class="fa-solid fa-arrow-right text-[10px] ml-1"></i>
            </a>
        </div>
    </main>

    <div id="application-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 px-4精准">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100 flex flex-col max-h-[90vh]">
            
            <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
                <h3 id="modal-form-title" class="text-base font-bold text-slate-800">表單申請</h3>
                <button onclick="closeApplicationForm()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form onsubmit="handleFormSubmit(event)" class="space-y-4 overflow-y-auto pr-1 flex-1 text-sm">
                
                <div class="grid grid-cols-2 gap-3 bg-slate-50 p-3 rounded-xl text-xs text-slate-600">
                    <div>申請同仁：<span id="form-emp-name" class="font-bold text-slate-800">---</span></div>
                    <div>所別：<span id="form-emp-office" class="font-bold text-indigo-600">---</span></div>
                </div>

                <div id="leave-fields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">假別選擇</label>
                        <select id="leave-type" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 bg-white">
                            <option value="事假">事假</option>
                            <option value="病假">病假</option>
                            <option value="特休">特休假 (特別休假)</option>
                            <option value="婚假/喪假">婚假 / 喪假</option>
                            <option value="公假">公假</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">請假開始日期</label>
                            <input type="date" id="leave-start-date" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">開始時間</label>
                            <input type="time" id="leave-start-time" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">請假結束日期</label>
                            <input type="date" id="leave-end-date" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">結束時間</label>
                            <input type="time" id="leave-end-time" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <div id="overtime-fields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">加班日期</label>
                        <input type="date" id="overtime-date" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">加班開始時間</label>
                            <input type="time" id="overtime-start" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">加班結束時間</label>
                            <input type="time" id="overtime-end" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">具體事由 / 備註說明</label>
                    <textarea id="form-reason" rows="3" required placeholder="請詳細填寫申請原因..." class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500 text-xs"></textarea>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md shadow-indigo-100">
                    確認送出申請
                </button>
            </form>
        </div>
    </div>

    <footer class="text-center py-4 text-[10px] text-slate-400 tracking-wide">
        © 2026 迦南科技管理部 · 智慧雲端系統
    </footer>

    <script>
        let currentEmployee = null;
        let activeFormType = ''; // 'leave' 或 'overtime'

        window.onload = function() {
            startClock();
            initSecurityCheck();
        };

        function initSecurityCheck() {
            if (!navigator.userAgent.includes("Line") && !navigator.userAgent.includes("LIFF")) {
                document.getElementById('login-mode-tag').innerText = "員工工號密碼登入";
                document.getElementById('login-mode-tag').className = "font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded";
                switchToPasswordLoginView();
                return;
            }

            liff.init({ liffId: SYSTEM_ENV.LIFF_ID })
                .then(() => {
                    if (liff.isInClient()) {
                        liff.getProfile().then(profile => {
                            verifyWithBackend(profile.userId, null, null, true);
                        }).catch(() => switchToPasswordLoginView());
                    } else {
                        switchToPasswordLoginView();
                    }
                })
                .catch(() => switchToPasswordLoginView());
        }

        function handlePasswordLoginSubmit(event) {
            event.preventDefault();
            const empId = document.getElementById('login-empId').value.trim();
            const password = document.getElementById('login-password').value.trim();

            document.getElementById('password-login-modal').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            verifyWithBackend(null, empId, password, false);
        }

        function verifyWithBackend(uid, empId, password, isLine) {
            let url = SYSTEM_ENV.GAS_WEB_APP_URL;
            if (isLine) {
                url += `?action=verifyLogin&lineUid=${encodeURIComponent(uid)}`;
            } else {
                url += `?action=verifyPasswordLogin&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        currentEmployee = res.data;
                        renderMainDashboard(res.data);
                    } else {
                        alert("登入校驗失敗：" + res.message);
                        switchToPasswordLoginView();
                    }
                })
                .catch(() => {
                    alert("無法連線至雲端資料庫，請檢查網路。");
                    switchToPasswordLoginView();
                });
        }

        function renderMainDashboard(emp) {
            document.getElementById('current-user-name').innerText = emp.name;
            document.getElementById('current-user-id').innerText = emp.empId;
            document.getElementById('current-user-office').innerText = emp.office || "未分所";

            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('password-login-modal').classList.add('hidden');

            if (emp.role === "Admin") {
                document.getElementById('admin-link-box').classList.remove('hidden');
            }
        }

        function switchToPasswordLoginView() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('password-login-modal').classList.remove('hidden');
        }

        // 打卡模組
        function submitPunch(type) {
            if (!currentEmployee) return alert("請先登入系統。");
            const memo = document.getElementById('punch-memo').value.trim();
            document.getElementById('loading-view').classList.remove('hidden');

            fetch(SYSTEM_ENV.GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "addAttendanceLog",
                    empId: currentEmployee.empId,
                    name: currentEmployee.name,
                    type: type,
                    memo: memo
                })
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('loading-view').classList.add('hidden');
                if (res.status === "success") {
                    alert(`🎉 【${currentEmployee.office}】${currentEmployee.name}\n${type}打卡成功！`);
                    document.getElementById('punch-memo').value = "";
                } else {
                    alert("打卡失敗：" + res.message);
                }
            }).catch(() => {
                document.getElementById('loading-view').classList.add('hidden');
                alert("打卡連線失敗。");
            });
        }

        // ========================================== -->
        // 🚀 開啟請假、加班表單
        // ========================================== -->
        function openApplicationForm(type) {
            if (!currentEmployee) return alert("請先完成安全驗證登入。");
            activeFormType = type;
            
            // 填入申請人基本資料
            document.getElementById('form-emp-name').innerText = currentEmployee.name;
            document.getElementById('form-emp-office').innerText = currentEmployee.office || "未分所";
            document.getElementById('form-reason').value = '';

            // 切換動態顯示欄位
            if (type === 'leave') {
                document.getElementById('modal-form-title').innerText = "員工請假申請單";
                document.getElementById('leave-fields').classList.remove('hidden');
                document.getElementById('overtime-fields').classList.add('hidden');
            } else {
                document.getElementById('modal-form-title').innerText = "員工加班延長工時申請單";
                document.getElementById('overtime-fields').classList.remove('hidden');
                document.getElementById('leave-fields').classList.add('hidden');
            }

            // 打開視窗
            document.getElementById('application-modal').classList.remove('hidden');
        }

        function closeApplicationForm() {
            document.getElementById('application-modal').classList.add('hidden');
        }

        // 處理表單送出（點擊確認按鈕）
        function handleFormSubmit(event) {
            event.preventDefault();
            document.getElementById('application-modal').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            // 根據目前開啟的種類包裝對應資料
            let details = {};
            if (activeFormType === 'leave') {
                details = {
                    formType: "請假",
                    leaveType: document.getElementById('leave-type').value,
                    start: document.getElementById('leave-start-date').value + " " + document.getElementById('leave-start-time').value,
                    end: document.getElementById('leave-end-date').value + " " + document.getElementById('leave-end-time').value
                };
            } else {
                details = {
                    formType: "加班",
                    date: document.getElementById('overtime-date').value,
                    start: document.getElementById('overtime-start').value,
                    end: document.getElementById('overtime-end').value
                };
            }
            details.reason = document.getElementById('form-reason').value.trim();

            // 💡 這裡可以延伸直接使用 fetch POST 發送給 GAS 寫入「請假紀錄表」，目前先彈出確認
            setTimeout(() => {
                document.getElementById('loading-view').classList.add('hidden');
                alert(`傳送成功！\n系統已將【${currentEmployee.office}】${currentEmployee.name}的「${details.formType}申請」同步寫入後台數據庫中心。`);
            }, 1000);
        }

        function startClock() {
            setInterval(() => {
                const now = new Date();
                const hr = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const sec = String(now.getSeconds()).padStart(2, '0');
                if(document.getElementById('clock-time')) document.getElementById('clock-time').innerText = `${hr}:${min}:${sec}`;
            }, 1000);
        }
    </script>
</body>
</html>
