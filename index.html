<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迦南科技管理部 - 行動打卡系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.liff.line.me/edge/2/sdk.js"></script>
    <script src="env.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <nav class="bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-md">
                員
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <span id="current-user-name" class="font-bold text-slate-800 text-base">載入中...</span>
                    <span id="current-user-office" class="bg-indigo-50 text-indigo-600 text-[10px] px-2 py-0.5 rounded-full font-semibold">---</span>
                </div>
                <p class="text-xs text-slate-400 mt-0.5">工號: <span id="current-user-id" class="font-mono font-medium">---</span> · 行動端打卡</p>
            </div>
        </div>
        <button onclick="window.location.reload()" class="text-xs text-slate-400 hover:text-slate-600 font-medium transition-colors">
            <i class="fa-solid fa-right-from-bracket"></i> 登出
        </button>
    </nav>

    <div id="loading-view" class="fixed inset-0 bg-slate-900/10 backdrop-blur-xs flex flex-col justify-center items-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center">
            <i class="fa-solid fa-spinner animate-spin text-3xl text-indigo-600 mb-3"></i>
            <p class="text-sm font-semibold text-slate-700">正在安全驗證登入環境...</p>
            <p class="text-[10px] text-slate-400 mt-1">智慧差勤 · 雲端同步</p>
        </div>
    </div>

    <div id="password-login-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-40 px-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-100">
            <div class="text-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">員工外網安全登入</h3>
                <p class="text-xs text-slate-400 mt-0.5">系統偵測到非 LINE 環境，請輸入工號密碼</p>
            </div>
            <form onsubmit="handlePasswordLoginSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">員工工號</label>
                    <input type="text" id="login-empId" required placeholder="例如: 001" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼</label>
                    <input type="password" id="login-password" required placeholder="初始密碼預設為工號" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-semibold text-sm transition-all">
                    驗證登入
                </button>
            </form>
        </div>
    </div>

    <main class="flex-1 max-w-md w-full mx-auto px-4 py-6 space-y-6">
        
        <div id="punch-section" class="bg-white rounded-2xl p-6 shadow-md border border-slate-100 text-center space-y-4">
            <div class="flex justify-between items-center bg-slate-50 px-4 py-2 rounded-xl text-xs">
                <span class="text-slate-500">安全認證模式：</span>
                <span id="login-mode-tag" class="font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">LINE 自動登入</span>
            </div>

            <div class="bg-slate-900 text-emerald-400 rounded-xl py-4 font-mono shadow-inner">
                <div id="clock-time" class="text-3xl font-bold tracking-wider">00:00:00</div>
                <div id="clock-date" class="text-xs text-slate-400 mt-1">2026年06月14日</div>
            </div>

            <div>
                <input type="text" id="punch-memo" placeholder="打卡備註說明 (選填)..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500 text-center">
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2">
                <button onclick="submitPunch('上班')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-sun animate-pulse"></i> <span>上班打卡</span>
                </button>
                <button onclick="submitPunch('下班')" class="bg-slate-700 hover:bg-slate-800 text-white py-3 rounded-xl font-bold text-sm shadow-md transition-all flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-moon"></i> <span>下班打卡</span>
                </button>
            </div>
        </div>

        <div id="form-section" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
            <h4 class="text-xs font-bold text-slate-500 px-1 tracking-wider uppercase">表單線上申請</h4>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="openFormModal('請假')" id="leave-apply-btn" class="flex flex-col items-center justify-center p-4 bg-slate-50 hover:bg-indigo-50/50 border border-slate-100 hover:border-indigo-100 rounded-xl transition-all group">
                    <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-lg shadow-xs group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-calendar-minus"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700 mt-2">請假申請</span>
                    <span class="text-[9px] text-slate-400 mt-0.5">事假/病假/特休</span>
                </button>

                <button onclick="openFormModal('加班')" id="overtime-apply-btn" class="flex flex-col items-center justify-center p-4 bg-slate-50 hover:bg-indigo-50/50 border border-slate-100 hover:border-indigo-100 rounded-xl transition-all group">
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-lg shadow-xs group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-user-clock"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-700 mt-2">加班申請</span>
                    <span class="text-[9px] text-slate-400 mt-0.5">平日/假日延長工時</span>
                </button>
            </div>
        </div>

        <div id="admin-link-box" class="hidden bg-linear-to-r from-slate-900 to-indigo-950 rounded-2xl p-4 text-white flex justify-between items-center shadow-md">
            <div>
                <p class="text-xs font-bold tracking-wide">偵測到最高管理員權限</p>
                <p class="text-[10px] text-slate-400 mt-0.5">您可以跨所查看所有員工差勤數據</p>
            </div>
            <a href="admin.html" class="bg-white text-slate-900 text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm hover:bg-slate-100 transition-colors">
                進入後台 <i class="fa-solid fa-arrow-right text-[10px] ml-1"></i>
            </a>
        </div>
    </main>

    <footer class="text-center py-4 text-[10px] text-slate-400 tracking-wide">
        © 2026 迦南科技管理部 · 智慧雲端系統
    </footer>

    <script>
        // 全域變數，用來暫存登入成功的員工完整資料
        let currentEmployee = null;

        window.onload = function() {
            startClock();
            initSecurityCheck();
        };

        // 1. LINE 智慧雙模偵測與安全降級機制
        function initSecurityCheck() {
            // 條件 A：如果不是在 LINE 環境打開（例如一般電腦瀏覽器 Chrome）
            if (!navigator.userAgent.includes("Line") && !navigator.userAgent.includes("LIFF")) {
                console.log("環境提示：非 LINE 開啟，啟用帳密防禦降級模組。");
                document.getElementById('login-mode-tag').innerText = "員工工號密碼登入";
                document.getElementById('login-mode-tag').className = "font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded";
                switchToPasswordLoginView();
                return;
            }

            // 條件 B：如果是 LINE 環境打開，自動呼叫 LIFF 免感應登入
            liff.init({ liffId: SYSTEM_ENV.LIFF_ID })
                .then(() => {
                    if (liff.isInClient()) {
                        liff.getProfile().then(profile => {
                            verifyWithBackend(profile.userId, null, null, true);
                        }).catch(() => switchToPasswordLoginView());
                    } else {
                        switchToPasswordLoginView();
                    }
                })
                .catch(() => switchToPasswordLoginView());
        }

        // 2. 處理外網手動帳密送出
        function handlePasswordLoginSubmit(event) {
            event.preventDefault();
            const empId = document.getElementById('login-empId').value.trim();
            const password = document.getElementById('login-password').value.trim();

            document.getElementById('password-login-modal').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            verifyWithBackend(null, empId, password, false);
        }

        // 3. 統一跟 GAS 後端核對權限與資料
        function verifyWithBackend(uid, empId, password, isLine) {
            let url = SYSTEM_ENV.GAS_WEB_APP_URL;
            if (isLine) {
                url += `?action=verifyLogin&lineUid=${encodeURIComponent(uid)}`;
            } else {
                url += `?action=verifyPasswordLogin&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        currentEmployee = res.data; // 儲存至全域
                        
                        // 💡 打開天窗！呼叫渲染函式，保證解除隱藏所有功能
                        renderMainDashboard(res.data);
                    } else {
                        alert("登入校驗失敗：" + res.message);
                        switchToPasswordLoginView();
                    }
                })
                .catch(() => {
                    alert("無法連線至雲端資料庫，請確認您的網路或後端發布狀態。");
                    switchToPasswordLoginView();
                });
        }

        // 4. 🔓 解鎖畫面的關鍵函式（請假、加班、打卡全面解鎖）
        function renderMainDashboard(emp) {
            document.getElementById('current-user-name').innerText = emp.name;
            document.getElementById('current-user-id').innerText = emp.empId;
            document.getElementById('current-user-office').innerText = emp.office || "未分所";

            // 確保所有按鈕與區塊強制現形，不再失蹤
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('password-login-modal').classList.add('hidden');

            // 如果該員工在資料庫的權限是 Admin，主動亮出後台控制入口
            if (emp.role === "Admin") {
                document.getElementById('admin-link-box').classList.remove('hidden');
            }
        }

        function switchToPasswordLoginView() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('password-login-modal').classList.remove('hidden');
        }

        // 5. 送出打卡紀錄
        function submitPunch(type) {
            if (!currentEmployee) return alert("系統尚未完成安全認證，無法打卡！");
            
            const memo = document.getElementById('punch-memo').value.trim();
            document.getElementById('loading-view').classList.remove('hidden');

            const postData = {
                action: "addAttendanceLog",
                empId: currentEmployee.empId,
                name: currentEmployee.name,
                type: type,
                memo: memo
            };

            fetch(SYSTEM_ENV.GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(postData)
            })
            .then(res => res.json())
            .then(res => {
                document.getElementById('loading-view').classList.add('hidden');
                if (res.status === "success") {
                    alert(`🎉 【${currentEmployee.office}】${currentEmployee.name}\n${type}打卡成功！`);
                    document.getElementById('punch-memo').value = ""; // 清空備註
                } else {
                    alert("打卡失敗：" + res.message);
                }
            })
            .catch(() => {
                document.getElementById('loading-view').classList.add('hidden');
                alert("網路連線逾時，打卡失敗。");
            });
        }

        // 6. 點擊請假/加班的彈出視窗（您可以自由串接您的彈窗或新網頁）
        function openFormModal(formType) {
            if (!currentEmployee) return alert("請先登入系統。");
            alert(`💡 系統提示：\n已成功為【${currentEmployee.office}】的 ${currentEmployee.name} 開啟「${formType}申請功能單」。\n(此處已完美保留，隨時可連接您的舊版表單功能)`);
        }

        // 電子時鐘計時器
        function startClock() {
            setInterval(() => {
                const now = new Date();
                const hr = String(now.getHours()).padStart(2, '0');
                const min = String(now.getMinutes()).padStart(2, '0');
                const sec = String(now.getSeconds()).padStart(2, '0');
                
                if(document.getElementById('clock-time')){
                    document.getElementById('clock-time').innerText = `${hr}:${min}:${sec}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
