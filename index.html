<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迦南科技管理部 行動打卡系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.liff.line.me/edge/2/sdk.js"></script>
    <script src="env.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen bg-gray-100">

    <nav id="main-nav" class="hidden bg-white shadow-sm border-b border-gray-200 px-4 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span id="nav-user-name" class="font-bold text-gray-800 text-base"></span>
                        <span id="nav-user-role" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-medium"></span>
                    </div>
                    <p class="text-xs text-gray-500 mt-0.5">
                        工號：<span id="nav-user-empid" class="font-mono font-medium"></span> · 行動端打卡
                    </p>
                </div>
            </div>
            <button onclick="handleLogout()" class="text-gray-400 hover:text-red-600 text-sm font-medium transition-colors flex items-center space-x-1">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>登出</span>
            </button>
        </div>
    </nav>

    <div class="max-w-md mx-auto px-4 pt-8 pb-12 flex flex-col justify-center min-h-[calc(100vh-64px)]">
        
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 w-full">
            
            <div class="text-center mb-6">
                <h1 id="company-title" class="text-xl font-bold text-gray-800">行動打卡系統</h1>
                <p class="text-xs text-gray-400 mt-1">智慧差勤 · 雲端同步</p>
            </div>

            <div id="loading-view" class="text-center py-8">
                <i class="fa-solid fa-spinner animate-spin text-3xl text-indigo-600 mb-3"></i>
                <p class="text-sm text-gray-500">正在安全驗證登入環境...</p>
            </div>

            <div id="login-view" class="hidden space-y-4">
                <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs flex items-start">
                    <i class="fa-solid fa-circle-info mt-0.5 mr-2 text-base text-amber-600"></i>
                    <div>系統偵測到您目前未使用 LINE 開啟。請改用您的「員工工號」與「密碼」進行安全登入。（預設密碼為您的人事聯絡電話）</div>
                </div>
                
                <form onsubmit="handlePasswordLogin(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">員工編號 (工號)</label>
                        <div class="relative">
                            <i class="fa-solid fa-id-card-clip absolute left-3 top-3 text-gray-400"></i>
                            <input type="text" id="login-empId" required placeholder="請輸入工號，例如：002" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 font-mono">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">登入密碼</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400"></i>
                            <input type="password" id="login-password" required placeholder="請輸入密碼" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-medium text-sm transition-all shadow-md shadow-indigo-100">
                        驗證並登入系統
                    </button>
                </form>
            </div>

            <div id="punch-view" class="hidden space-y-5">
                <div class="flex justify-between items-center bg-gray-50 border border-gray-100 px-3 py-2 rounded-xl text-xs">
                    <span class="text-gray-500 font-medium">安全認證模式：</span>
                    <span id="login-method-tag" class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold"></span>
                </div>

                <div class="text-center bg-gray-900 rounded-2xl py-4 shadow-inner shadow-black/20">
                    <div id="clock-time" class="text-3xl font-bold font-mono text-emerald-400 tracking-wider">00:00:00</div>
                    <div id="clock-date" class="text-xs text-gray-400 font-medium mt-1">2026 年 06 月 14 日</div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">打卡備註說明 (選填)</label>
                    <input type="text" id="punch-memo" placeholder="如公出、外勤、遲到說明..." class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4 pt-2">
                    <button onclick="executePunch('上班')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold text-base transition-all shadow-lg shadow-emerald-100 text-center block cursor-pointer">
                        <i class="fa-solid fa-sun text-xl block mb-1"></i>上班打卡
                    </button>
                    <button onclick="executePunch('下班')" class="bg-slate-700 hover:bg-slate-800 text-white py-4 rounded-2xl font-bold text-base transition-all shadow-lg shadow-slate-200 text-center block cursor-pointer">
                        <i class="fa-solid fa-moon text-xl block mb-1"></i>下班打卡
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const GAS_URL = SYSTEM_ENV.GAS_WEB_APP_URL;
        let CURRENT_USER = null; 

        window.onload = function() {
            // 1. 徹底清除畫面上任何可能殘留的寫死測試字樣
            document.getElementById('nav-user-name').innerText = "";
            document.getElementById('nav-user-empid').innerText = "";
            document.getElementById('nav-user-role').innerText = "";
            
            // 2. 動態替換企業名稱
            if (SYSTEM_ENV.COMPANY_NAME) {
                document.getElementById('company-title').innerText = SYSTEM_ENV.COMPANY_NAME + " 行動打卡";
            }
            
            // 3. 啟動前台即時時鐘每秒跑動
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock-time').innerText = now.toTimeString().split(' ')[0];
                document.getElementById('clock-date').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
            }, 1000);

            // 4. 啟動驗證流程
            initLiffSystem();
        };

        // 初始化 LIFF 系統 (修正防卡死安全機制)
        function initLiffSystem() {
            // 如果是在標準一般瀏覽器環境，完全不等待 LIFF，直接切換傳統密碼登入，防止因 LINE 套件阻斷卡死
            if (!navigator.userAgent.includes("Line") && !navigator.userAgent.includes("LIFF")) {
                console.log("偵測到為一般瀏覽器環境，直接啟動工號密碼登入。");
                showLoginView();
                return;
            }

            if (!SYSTEM_ENV.LIFF_ID || SYSTEM_ENV.LIFF_ID.includes("XXXX")) {
                showLoginView();
                return;
            }

            // LINE 內部環境執行初始化
            liff.init({ liffId: SYSTEM_ENV.LIFF_ID })
                .then(() => {
                    if (liff.isInClient()) {
                        liff.getProfile().then(profile => {
                            verifyEmployeeByLineUid(profile.userId); 
                        }).catch(err => {
                            console.error("取得 LINE Profile 失敗:", err);
                            showLoginView();
                        });
                    } else {
                        showLoginView();
                    }
                })
                .catch(err => {
                    console.error("LIFF 啟用失敗，切換至傳統密碼模式:", err);
                    showLoginView(); // 就算 LIFF 報錯，也強制進入帳密畫面，絕不卡死
                });
        }

        // 後端驗證：LINE UID 模式
        function verifyEmployeeByLineUid(uid) {
            const url = `${GAS_URL}?action=verifyLogin&lineUid=${encodeURIComponent(uid)}&_t=${new Date().getTime()}`;
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        CURRENT_USER = res.data;
                        showPunchView("LINE 自動安全認證");
                    } else {
                        alert(`⚠️ 系統提示：\n您的 LINE 帳號尚未與後台員工檔案進行對應綁定。\n\n請將您的 LINE UID 提供給管理員：\n${uid}`);
                        document.getElementById('loading-view').innerHTML = `<div class="text-sm text-red-500 font-medium p-4 bg-red-50 rounded-xl border border-red-100">❌ 權限未開通，請先聯繫管理員綁定 LINE 帳號。</div>`;
                    }
                })
                .catch(() => showLoginView());
        }

        // 後端驗證：非 LINE 環境的【帳號密碼登入模式】
        function handlePasswordLogin(event) {
            event.preventDefault();
            const empId = document.getElementById('login-empId').value.trim();
            const password = document.getElementById('login-password').value.trim();

            // 轉入驗證中狀態
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            const url = `${GAS_URL}?action=verifyPasswordLogin&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}&_t=${new Date().getTime()}`;
            
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        CURRENT_USER = res.data;
                        CURRENT_USER.empId = empId; 
                        showPunchView("員工工號密碼登入");
                    } else {
                        alert("❌ 登入失敗：" + res.message);
                        document.getElementById('loading-view').classList.add('hidden');
                        document.getElementById('login-view').classList.remove('hidden');
                    }
                })
                .catch(() => {
                    alert("連線後端錯誤，請確認 GAS 部署是否正確發布。");
                    showLoginView();
                });
        }

        // 處理打卡寫入動作
        function executePunch(type) {
            if (!CURRENT_USER) return alert("連線逾期，請刷新頁面重新登入");
            
            const memo = document.getElementById('punch-memo').value.trim();
            const punchData = {
                action: "addAttendanceLog",
                empId: CURRENT_USER.empId,
                name: CURRENT_USER.name,
                type: type,
                memo: memo
            };

            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify(punchData)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert(`🎉 打卡成功！\n【${CURRENT_USER.name}】已完成 ${type} 簽到。\n時間：${new Date().toLocaleTimeString('zh-TW', {hour12:false})}`);
                    document.getElementById('punch-memo').value = ""; 
                } else {
                    alert("打卡失敗：" + res.message);
                }
            })
            .catch(() => alert("打卡失敗，請檢查網路連線。"));
        }

        // 登出機制
        function handleLogout() {
            CURRENT_USER = null;
            document.getElementById('main-nav').classList.add('hidden');
            showLoginView();
        }

        // 畫面控制：切換至【登入輸入框】
        function showLoginView() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('punch-view').classList.add('hidden');
            document.getElementById('main-nav').classList.add('hidden'); 
            document.getElementById('login-view').classList.remove('hidden');
        }

        // 畫面控制：驗證成功切換至【打卡面板】
        function showPunchView(methodName) {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('login-view').classList.add('hidden');
            
            // 💡 動態填入經後端安全驗證後的正確員工資料，拒絕寫死資料
            document.getElementById('nav-user-name').innerText = CURRENT_USER.name;
            document.getElementById('nav-user-empid').innerText = CURRENT_USER.empId;
            document.getElementById('nav-user-role').innerText = CURRENT_USER.role === "Admin" ? "最高管理員" : "在職員工";
            
            document.getElementById('login-method-tag').innerText = methodName;
            
            // 打開上方導覽列與打卡面板
            document.getElementById('main-nav').classList.remove('hidden');
            document.getElementById('punch-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
