<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行動人事出勤系統</title>
    <script src="env.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col justify-between select-none">

    <!-- 帳號密碼登入蓋板（LINE 無法偵測時顯示） -->
    <div id="password-login-overlay" class="fixed inset-0 bg-gradient-to-br from-indigo-700 to-indigo-900 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xs w-full p-6 space-y-4">
            <div class="text-center">
                <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-lock text-2xl text-indigo-600"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-800">員工登入</h2>
                <p id="login-company-name" class="text-sm text-gray-400 mt-1">人事出勤系統</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">員工工號</label>
                <input type="text" id="login-empId" placeholder="請輸入員工工號"
                    class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                <input type="password" id="login-password" placeholder="請輸入密碼"
                    onkeydown="if(event.key==='Enter') loginWithPassword()"
                    class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-300">
            </div>
            <p id="login-error-msg" class="text-xs text-red-500 text-center hidden"></p>
            <button onclick="loginWithPassword()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-2.5 rounded-xl transition-all shadow-md">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>登入
            </button>
        </div>
    </div>

    <header class="bg-white px-4 py-3 shadow-sm flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-3">
            <div id="userAvatarContainer" class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-lg shadow-sm overflow-hidden">
                員
            </div>
            <div>
                <div class="flex items-center space-x-1">
                    <span class="font-bold text-gray-800 text-base" id="userName">載入中...</span>
                    <span class="text-xs bg-gray-100 text-gray-600 px-1.5 py-0.5 rounded-full font-medium" id="userBranch"></span>
                    <span class="text-xs bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full font-medium" id="userRole">載入中</span>
                </div>
                <p class="text-xs text-gray-500" id="userEmpId">權限：確認中</p>
            </div>
        </div>
        <button onclick="handleLogout()" class="text-gray-400 hover:text-red-500 text-sm font-medium transition">
            <i class="fa-solid fa-right-from-bracket mr-1"></i>登出
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-20">
        
        <section id="page-clock" class="space-y-4">
            <div class="bg-gradient-to-br from-indigo-600 to-indigo-700 text-white rounded-2xl p-6 text-center shadow-md">
                <p class="text-sm opacity-80 tracking-wider mb-1" id="currentDate">2026年06月12日 星期五</p>
                <h1 class="text-4xl font-black tracking-tight" id="currentTime">00:00:00</h1>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="handleClock('上班')" class="bg-white border border-gray-200 active:scale-95 transition-all rounded-2xl p-5 flex flex-col items-center justify-center shadow-sm hover:shadow-md group">
                    <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center text-2xl mb-3 group-hover:bg-emerald-100 transition-colors">
                        <i class="fa-solid fa-business-time"></i>
                    </div>
                    <span class="font-bold text-gray-800 text-base">上班打卡</span>
                    <span class="text-xs text-gray-400 mt-1">建議 09:00 前</span>
                </button>

                <button onclick="handleClock('下班')" class="bg-white border border-gray-200 active:scale-95 transition-all rounded-2xl p-5 flex flex-col items-center justify-center shadow-sm hover:shadow-md group">
                    <div class="w-14 h-14 bg-orange-50 text-orange-600 rounded-full flex items-center justify-center text-2xl mb-3 group-hover:bg-orange-100 transition-colors">
                        <i class="fa-solid fa-mug-hot"></i>
                    </div>
                    <span class="font-bold text-gray-800 text-base">下班打卡</span>
                    <span class="text-xs text-gray-400 mt-1">建議 18:00 後</span>
                </button>
            </div>

            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-3 flex items-center">
                    <i class="fa-solid fa-history mr-2 text-indigo-500"></i>今日打卡狀態
                </h3>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center pb-2 border-b border-gray-50">
                        <span class="text-gray-500">上班時間</span>
                        <span class="font-medium text-gray-400" id="todayClockIn">尚未打卡</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-500">下班時間</span>
                        <span class="font-medium text-gray-400" id="todayClockOut">尚未打卡</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="page-form" class="hidden bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
            <h2 class="text-lg font-bold text-gray-800 border-b pb-2">📋 表單申請</h2>
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">申請項目</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="toggleFormType('leave')" id="btn-type-leave" class="py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold text-sm transition">
                        請假申請
                    </button>
                    <button type="button" onclick="toggleFormType('overtime')" id="btn-type-overtime" class="py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium text-sm transition">
                        加班申請
                    </button>
                </div>
            </div>

            <div id="leave-type-block">
                <label class="block text-sm font-bold text-gray-700 mb-1">假別</label>
                <select id="form-sub-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    <option value="事假">事假</option>
                    <option value="病假">病假</option>
                    <option value="特休">特休</option>
                    <option value="婚假/喪假">婚假/喪假</option>
                </select>
            </div>

            <div id="ot-type-block" class="hidden">
                <label class="block text-sm font-bold text-gray-700 mb-1">加班類型</label>
                <select id="form-ot-type" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    <option value="平日加班">平日加班</option>
                    <option value="休息日加班">休息日加班</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">開始日期時間</label>
                    <input type="datetime-local" id="form-start-time" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">結束日期時間</label>
                    <input type="datetime-local" id="form-end-time" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">合計申請時數 (小時)</label>
                <input type="number" id="form-hours" placeholder="例如: 8" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">事由 / 備註說明</label>
                <textarea id="form-reason" rows="3" placeholder="請輸入具體原因..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <button onclick="submitApplication()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-sm hover:bg-indigo-700 active:scale-98 transition-all text-sm">
                送出申請單
            </button>
        </section>

        <section id="page-history" class="hidden space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-lg font-bold text-gray-800">🔍 申請進度追蹤</h2>
                <button onclick="loadMyForms()" class="text-xs text-indigo-600 font-medium">重新整理</button>
            </div>
            <div id="history-list" class="space-y-3">
                <div class="text-center text-gray-400 text-sm py-8">載入中...</div>
            </div>
        </section>

    </main>

    <!-- 查無員工資料時顯示 LINE ID -->
    <div id="bind-overlay" class="hidden fixed inset-0 bg-black bg-opacity-60 z-[100] flex items-center justify-center px-6">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-xl text-center">
            <div class="text-3xl">⚠️</div>
            <h2 class="text-lg font-bold text-gray-800">尚未建立員工資料</h2>
            <p class="text-sm text-gray-500">請將以下 LINE ID 提供給管理員，由管理員在後台建立您的員工資料後即可使用。</p>
            <div class="bg-gray-50 rounded-xl p-3 break-all text-xs text-gray-700 font-mono select-all" id="show-line-uid"></div>
            <p class="text-xs text-gray-400">長按上方 ID 可複製</p>
        </div>
    </div>

<div class="fixed bottom-16 right-2 z-40 text-[10px] text-gray-300 select-none" id="appVersion"></div>
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 h-16 flex items-center justify-around px-2 shrink-0 shadow-[0_-2px_10px_rgba(0,0,0,0.03)] z-50">
        <button onclick="switchPage('clock')" id="nav-clock" class="flex flex-col items-center justify-center w-20 text-indigo-600 transition-colors">
            <i class="fa-solid fa-clock-rotate-left text-xl"></i>
            <span class="text-[11px] font-bold mt-1">打卡首頁</span>
        </button>
        <button onclick="switchPage('form')" id="nav-form" class="flex flex-col items-center justify-center w-20 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="fa-solid fa-file-pen text-xl"></i>
            <span class="text-[11px] font-medium mt-1">表單申請</span>
        </button>
        <button onclick="switchPage('history')" id="nav-history" class="flex flex-col items-center justify-center w-20 text-gray-400 hover:text-gray-600 transition-colors">
            <i class="fa-solid fa-list-check text-xl"></i>
            <span class="text-[11px] font-medium mt-1">申請進度</span>
        </button>
    </nav>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <script>
        // --- 0. 版本號（每次更新請修改此處）---
        const APP_VERSION = "v1.0.7";

        // --- 1. 全域變數宣告 ---
        // 直接從已載入的 env.js (SYSTEM_ENV) 讀取設定，不再 fetch env.txt
        let GAS_WEB_APP_URL = (typeof SYSTEM_ENV !== "undefined") ? SYSTEM_ENV.GAS_WEB_APP_URL : "";
        let currentFormType = 'leave';

        // 預設員工資訊（當 LINE LIFF 順利初始化後，會自動被真實 LINE 個資覆蓋）
        const currentEmployee = {
            empId: "E001",
            name: "未登入員工",
            viaLine: false   // 是否透過 LINE 登入（打卡需要此為 true，帳密登入則維持 false）
        };

        // LIFF ID 從 env.js 讀取
        const MY_LIFF_ID = (typeof SYSTEM_ENV !== "undefined") ? SYSTEM_ENV.LIFF_ID : "";

        // --- 2. 網頁事件監聽（啟動時鐘並初始化 LIFF） ---
        window.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            document.getElementById('appVersion').innerText = APP_VERSION;

            if (!GAS_WEB_APP_URL) {
                console.error("env.js 未載入或 GAS_WEB_APP_URL 為空");
                alert("⚠️ 系統警報：無法讀取 env.js 設定，請確認檔案已正確放置。");
                return;
            }
            console.log("員工端 GAS 網址加載成功:", GAS_WEB_APP_URL);
            initializeLiff();
            // 頁面重新整理後，延遲 5 秒等 LIFF 登入完成，再讀取今日打卡狀態
            setTimeout(loadTodayAttendance, 5000);
        });

        // --- 3. LINE LIFF 初始化與個資抓取功能 ---
        function showPasswordLogin() {
            if (SYSTEM_ENV.COMPANY_NAME) {
                document.getElementById('login-company-name').innerText = SYSTEM_ENV.COMPANY_NAME;
            }
            document.getElementById('password-login-overlay').classList.remove('hidden');
        }

        function loginWithPassword() {
            const empId    = document.getElementById('login-empId').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const errEl    = document.getElementById('login-error-msg');

            if (!empId || !password) {
                errEl.innerText = "請輸入工號和密碼";
                errEl.classList.remove('hidden');
                return;
            }
            errEl.classList.add('hidden');

            fetch(`${GAS_WEB_APP_URL}?action=loginWithPassword&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}`)
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        document.getElementById('password-login-overlay').classList.add('hidden');
                        applyEmployeeData(res.data);
                    } else {
                        errEl.innerText = res.message || "工號或密碼錯誤";
                        errEl.classList.remove('hidden');
                    }
                })
                .catch(() => {
                    errEl.innerText = "連線失敗，請稍後再試";
                    errEl.classList.remove('hidden');
                });
        }

        function initializeLiff() {
            if (!MY_LIFF_ID || MY_LIFF_ID === "貼上你的_LIFF_ID_在這邊") {
                showPasswordLogin();
                return;
            }

            // LIFF SDK 未載入時，改用帳號密碼登入
            if (typeof liff === "undefined") {
                showPasswordLogin();
                return;
            }

            liff.init({ liffId: MY_LIFF_ID })
                .then(() => {
                    // 不在 LINE App 內（電腦瀏覽器等），改用帳號密碼登入
                    if (!liff.isInClient() && !liff.isLoggedIn()) {
                        showPasswordLogin();
                        return;
                    }
                    if (!liff.isLoggedIn()) {
                        liff.login(); // 在 LINE App 內跳 LINE 登入
                    } else {
                        // 已登入，抓取 LINE 個人資料
                        liff.getProfile()
                            .then(profile => {
                                currentEmployee.name = profile.displayName;
                                document.getElementById('userName').innerText = profile.displayName;

                                if (profile.pictureUrl) {
                                    document.getElementById('userAvatarContainer').innerHTML =
                                        `<img src="${profile.pictureUrl}" class="w-full h-full rounded-full object-cover">`;
                                }

                                currentEmployee.lineUid = profile.userId;
                                return fetch(`${GAS_WEB_APP_URL}?action=verifyLogin&lineUid=${encodeURIComponent(profile.userId)}`);
                            })
                            .then(r => r.json())
                            .then(res => {
                                if (res.status === 'success') {
                                    currentEmployee.viaLine = true; // 透過 LINE 登入成功，打卡資格符合「用 LINE」這項條件
                                    applyEmployeeData(res.data);
                                } else {
                                    // 查無此人 → 顯示 LINE UID 讓管理員設定
                                    document.getElementById('show-line-uid').innerText = currentEmployee.lineUid || '無法取得';
                                    document.getElementById('bind-overlay').classList.remove('hidden');
                                }
                            })
                            .catch(err => console.error("verifyLogin 失敗:", err));
                    }
                })
                .catch(() => {
                    // LIFF 初始化失敗（例如非 LINE 平台），改用帳號密碼登入
                    showPasswordLogin();
                });
        }

        // 套用員工資料到全域變數與畫面
        function applyEmployeeData(data) {
            currentEmployee.empId   = data.empId;
            currentEmployee.name    = data.name;
            currentEmployee.branch  = data.branch || "";
            document.getElementById('userName').innerText   = data.name;
            document.getElementById('userRole').innerText   = data.role   || '員工';
            document.getElementById('userEmpId').innerText  = `權限：${data.role || '一般'}`;
            const branchEl = document.getElementById('userBranch');
            if (data.branch) {
                branchEl.innerText = data.branch;
                branchEl.style.display = '';
            } else {
                branchEl.style.display = 'none';
            }
            loadTodayAttendance(); // 登入後立即讀取今日打卡狀態
        }

        // 讀取今日打卡紀錄並顯示在首頁
        function loadTodayAttendance() {
            const empId = currentEmployee.empId;
            if (!GAS_WEB_APP_URL || !empId || empId === 'E001') return; // 尚未登入時跳過
            fetch(`${GAS_WEB_APP_URL}?action=getTodayAttendance&empId=${encodeURIComponent(empId)}`)
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') return;
                    const d = res.data;
                    const inEl  = document.getElementById('todayClockIn');
                    const outEl = document.getElementById('todayClockOut');
                    if (d.clockIn) {
                        inEl.innerText  = `${d.clockIn} (成功)`;
                        inEl.className  = "font-medium text-emerald-600";
                    }
                    if (d.clockOut) {
                        outEl.innerText = `${d.clockOut} (成功)`;
                        outEl.className = "font-medium text-emerald-600";
                    }
                })
                .catch(() => {});
        }

        // --- 4. 介面與功能函式定義 ---
        function updateClock() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const dayNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('currentDate').innerText = `${year}年${month}月${date}日 ${dayNames[now.getDay()]}`;
            document.getElementById('currentTime').innerText = now.toTimeString().split(' ')[0];
        }

        function switchPage(pageId) {
            document.getElementById('page-clock').classList.add('hidden');
            document.getElementById('page-form').classList.add('hidden');
            document.getElementById('page-history').classList.add('hidden');
            document.getElementById(`page-${pageId}`).classList.remove('hidden');

            ['clock', 'form', 'history'].forEach(nav => {
                const btn = document.getElementById(`nav-${nav}`);
                btn.className = "flex flex-col items-center justify-center w-20 text-gray-400";
                btn.querySelector('span').className = "text-[11px] font-medium mt-1";
            });

            const activeBtn = document.getElementById(`nav-${pageId}`);
            activeBtn.className = "flex flex-col items-center justify-center w-20 text-indigo-600";
            activeBtn.querySelector('span').className = "text-[11px] font-bold mt-1";

            if (pageId === 'history') loadMyForms();
        }

        function toggleFormType(type) {
            currentFormType = type;
            const btnLeave = document.getElementById('btn-type-leave');
            const btnOvertime = document.getElementById('btn-type-overtime');
            const leaveBlock = document.getElementById('leave-type-block');
            const otBlock = document.getElementById('ot-type-block');

            if (type === 'leave') {
                btnLeave.className = "py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold text-sm transition";
                btnOvertime.className = "py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium text-sm transition";
                leaveBlock.classList.remove('hidden');
                otBlock.classList.add('hidden');
            } else {
                btnOvertime.className = "py-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 font-bold text-sm transition";
                btnLeave.className = "py-2.5 rounded-xl border border-gray-200 text-gray-600 font-medium text-sm transition";
                leaveBlock.classList.add('hidden');
                otBlock.classList.remove('hidden');
            }
        }

        function handleClock(type, btnEl) {
            if (!GAS_WEB_APP_URL) {
                alert("❌ 連線失敗：尚未成功載入 GAS 雲端網址，請確認 env.txt 設定。");
                return;
            }

            // 條件一：必須是透過 LINE 登入（帳號密碼登入者不符合打卡資格）
            if (!currentEmployee.viaLine) {
                alert("❌ 無法完成打卡：請使用 LINE 登入後再進行打卡。");
                return;
            }

            // 鎖住按鈕避免重複點擊，並提示「定位中」
            const clickedBtn = btnEl || (event && event.currentTarget);
            const originalHtml = clickedBtn ? clickedBtn.innerHTML : null;
            if (clickedBtn) {
                clickedBtn.disabled = true;
                clickedBtn.classList.add('opacity-60');
            }

            // 條件二：必須成功取得定位，否則不允許打卡（不會送出任何打卡請求）
            getCurrentLocation()
                .then(coords => sendClockRequest(type, coords))
                .catch(() => {
                    alert("❌ 無法完成打卡：請開啟定位權限後再試一次。");
                })
                .finally(() => {
                    if (clickedBtn) {
                        clickedBtn.disabled = false;
                        clickedBtn.classList.remove('opacity-60');
                        if (originalHtml !== null) clickedBtn.innerHTML = originalHtml;
                    }
                });
        }

        // 取得目前 GPS 定位座標（Promise 包裝，含逾時保護）
        function getCurrentLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) { reject("此裝置/瀏覽器不支援定位"); return; }
                navigator.geolocation.getCurrentPosition(
                    pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }),
                    err => reject(err),
                    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
                );
            });
        }

        function sendClockRequest(type, coords) {
            const nowTime = document.getElementById('currentTime').innerText;

            // 走到這裡時，已通過「LINE 登入」與「定位成功」兩項檢查，coords 必定有值
            const payload = {
                action: "clockInOut",
                empId: currentEmployee.empId,
                name: currentEmployee.name,
                type: type,
                memo: "LINE 現場打卡",
                lat: coords.lat,
                lng: coords.lng
            };

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert(`🎉 系統已成功寫入：${type}打卡紀錄！\n打卡員工：${currentEmployee.name}\n時間：${nowTime}`);
                // 先立即更新畫面，再延遲 2 秒從 GAS 確認最新狀態
                if (type === '上班') {
                    document.getElementById('todayClockIn').innerText = `${nowTime} (成功)`;
                    document.getElementById('todayClockIn').className = "font-medium text-emerald-600";
                } else {
                    document.getElementById('todayClockOut').innerText = `${nowTime} (成功)`;
                    document.getElementById('todayClockOut').className = "font-medium text-emerald-600";
                }
                setTimeout(loadTodayAttendance, 2000); // 2秒後從GAS重新確認
            })
            .catch(error => {
                console.error("API 錯誤:", error);
                alert("打卡連線發生錯誤。");
            });
        }

        // 設定欄位的錯誤/正常樣式
        function setFieldError(id, hasError) {
            const el = document.getElementById(id);
            if (!el) return;
            if (hasError) {
                el.classList.add('border-red-400', 'bg-red-50');
                el.classList.remove('border-gray-200', 'bg-gray-50');
            } else {
                el.classList.remove('border-red-400', 'bg-red-50');
                el.classList.add('border-gray-200', 'bg-gray-50');
            }
        }

        function submitApplication() {
            if (!GAS_WEB_APP_URL) { alert("❌ 連線失敗：尚未載入設定網址。"); return; }

            const startTime  = document.getElementById('form-start-time').value;
            const endTime    = document.getElementById('form-end-time').value;
            const totalHours = document.getElementById('form-hours').value;
            const reason     = document.getElementById('form-reason').value.trim();
            const subType    = document.getElementById('form-sub-type').value;
            const otType     = document.getElementById('form-ot-type').value;

            // 逐欄清除舊錯誤狀態
            ['form-start-time', 'form-end-time', 'form-hours', 'form-reason'].forEach(id => setFieldError(id, false));

            // 逐欄驗證，收集所有錯誤訊息
            const errors = [];

            if (!startTime) {
                setFieldError('form-start-time', true);
                errors.push('請填寫「開始日期時間」');
            }
            if (!endTime) {
                setFieldError('form-end-time', true);
                errors.push('請填寫「結束日期時間」');
            }
            if (startTime && endTime && endTime <= startTime) {
                setFieldError('form-end-time', true);
                errors.push('「結束日期時間」必須晚於開始時間');
            }
            if (!totalHours || Number(totalHours) <= 0) {
                setFieldError('form-hours', true);
                errors.push('請填寫「合計時數」且須大於 0');
            }
            if (!reason) {
                setFieldError('form-reason', true);
                errors.push('請填寫「事由 / 備註說明」');
            }

            if (errors.length > 0) {
                alert('⚠️ 請修正以下欄位：\n\n• ' + errors.join('\n• '));
                return;
            }

            const payload = {
                action: "submitForm",
                empId: currentEmployee.empId,
                name: currentEmployee.name,
                formType: currentFormType === 'leave' ? '請假' : '加班',
                subType: currentFormType === 'leave' ? subType : otType,
                startTime: startTime.replace("T", " "),
                endTime: endTime.replace("T", " "),
                totalHours: totalHours,
                reason: reason
            };

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert(`📋 表單已順利上傳！\n申請人：${currentEmployee.name}\n等待主管核簽。`);
                // 清空欄位並移除錯誤狀態
                ['form-start-time', 'form-end-time', 'form-hours', 'form-reason'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) { el.value = ""; setFieldError(id, false); }
                });
                switchPage('history');
            })
            .catch(error => {
                console.error("API 錯誤:", error);
                alert("表單送出失敗。");
            });
        }

        function loadMyForms() {
            const container = document.getElementById('history-list');
            if (!GAS_WEB_APP_URL) {
                container.innerHTML = '<div class="text-center text-red-400 text-sm py-4">❌ GAS 網址未載入</div>';
                return;
            }
            container.innerHTML = '<div class="text-center text-gray-400 text-sm py-8">載入中...</div>';

            const empId = currentEmployee.empId || "";
            fetch(`${GAS_WEB_APP_URL}?action=getMyForms&empId=${encodeURIComponent(empId)}`)
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') {
                        container.innerHTML = `<div class="text-center text-red-400 text-sm py-4">❌ 載入失敗：${res.message || '請稍後再試'}</div>`;
                        return;
                    }
                    // 日期格式：「2026-06-14 09:00」→「115年6月14日 上午9：00」
                    function fmtDT(str) {
                        if (!str) return '';
                        const parts = str.trim().split(' ');
                        const d = parts[0].split('-');
                        if (d.length !== 3) return str;
                        const roc   = parseInt(d[0]) - 1911;
                        const month = parseInt(d[1]);
                        const day   = parseInt(d[2]);
                        let timeStr = '';
                        if (parts[1]) {
                            const t = parts[1].split(':');
                            let h = parseInt(t[0]);
                            const m = (t[1] || '00').slice(0, 2);
                            const period = h < 12 ? '上午' : '下午';
                            if (h === 0) h = 12;
                            else if (h > 12) h -= 12;
                            timeStr = ` ${period}${h}：${m}`;
                        }
                        return `${roc}年${month}月${day}日${timeStr}`;
                    }

                    // 只保留近一個月的記錄（formId = "F" + timestamp ms）
                    const oneMonthAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
                    const filtered = res.data.filter(f => {
                        const ts = parseInt(f.formId.replace(/^F/, ''));
                        return !isNaN(ts) && ts >= oneMonthAgo;
                    });

                    // 依申請時間降冪排列（最新在上）
                    filtered.sort((a, b) => b.formId.localeCompare(a.formId));

                    if (filtered.length === 0) {
                        container.innerHTML = `<div class="text-center text-gray-400 text-sm py-4">近一個月內無申請紀錄</div>`;
                        return;
                    }

                    container.innerHTML = filtered.map(f => {
                        // 狀態顯示（GAS 寫入值為「已核准」/「已拒絕」/「待審核」）
                        let statusColor, statusLabel;
                        if (f.status === '待審核') {
                            statusColor = 'bg-amber-100 text-amber-700';
                            statusLabel = '⏳ 待審核';
                        } else if (f.status === '已核准') {
                            statusColor = 'bg-emerald-100 text-emerald-700';
                            statusLabel = '已核准';
                        } else if (f.status === '已拒絕') {
                            statusColor = 'bg-gray-100 text-gray-500';
                            statusLabel = '已拒絕';
                        } else {
                            statusColor = 'bg-gray-100 text-gray-500';
                            statusLabel = f.status;
                        }
                        // 從 formId 時間戳算出申請日期（民國，不含時間）
                        const applyTs = parseInt(f.formId.replace(/^F/, ''));
                        let applyDateStr = '';
                        if (!isNaN(applyTs)) {
                            const ad = new Date(applyTs);
                            applyDateStr = `${ad.getFullYear() - 1911}年${ad.getMonth() + 1}月${ad.getDate()}日`;
                        }
                        const catColor  = f.category === '請假' ? 'bg-indigo-100 text-indigo-700' : 'bg-orange-100 text-orange-700';
                        const canDelete = f.status === '待審核';
                        const deleteBtn = canDelete
                            ? `<button onclick="deleteForm('${f.formId}','${f.category}')" class="text-red-400 hover:text-red-600 text-xs px-2 py-0.5 rounded border border-red-200 hover:border-red-400 transition">🗑 撤回</button>`
                            : '';
                        return `
                        <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-2">
                            <div class="flex justify-between items-center">
                                <div class="flex gap-2">
                                    <span class="text-xs font-bold px-2 py-0.5 rounded-full ${catColor}">${f.category}</span>
                                    <span class="text-xs text-gray-500 self-center">${f.subType}</span>
                                </div>
                                <span class="text-xs font-bold px-2 py-0.5 rounded-full ${statusColor}">${statusLabel}</span>
                            </div>
                            <div class="text-xs text-gray-400">申請日期：${applyDateStr}</div>
                            <div class="text-xs text-gray-600">
                                📅 ${fmtDT(f.startTime)} → ${fmtDT(f.endTime)}　${f.totalHours}小時
                            </div>
                            <div class="flex justify-between items-center text-xs text-gray-400">
                                <span>${f.reason}</span>
                                ${deleteBtn}
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(() => {
                    container.innerHTML = '<div class="text-center text-red-400 text-sm py-8">載入失敗，請稍後再試</div>';
                });
        }

        function deleteForm(formId, category) {
            if (!confirm(`確定要撤回這筆「${category}」申請嗎？`)) return;
            const payload = {
                action: "deleteForm",
                formId: formId,
                category: category
            };
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            }).then(() => {
                alert("✅ 申請已撤回");
                loadMyForms(); // 重新整理清單
            }).catch(() => {
                alert("撤回失敗，請稍後再試");
            });
        }

        function handleLogout() {
            if (liff.isLoggedIn()) {
                liff.logout();
                alert("已成功登出 LINE 綁定狀態。");
                location.reload();
            } else {
                alert("目前非 LIFF 登入狀態。");
            }
        }
    </script>
