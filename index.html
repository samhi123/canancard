<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業雲端行動打卡系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.liff.line.me/edge/2/sdk.js"></script>
    <script src="env.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-6">
        
        <div class="text-center mb-6">
            <h1 id="company-title" class="text-xl font-bold text-gray-800">行動打卡系統</h1>
            <p class="text-xs text-gray-400 mt-1">智慧差勤 · 雲端同步</p>
        </div>

        <div id="loading-view" class="text-center py-8">
            <i class="fa-solid fa-spinner animate-spin text-3xl text-indigo-600 mb-3"></i>
            <p class="text-sm text-gray-500">正在安全驗證登入環境...</p>
        </div>

        <div id="login-view" class="hidden space-y-4">
            <div class="bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-xl text-xs flex items-start">
                <i class="fa-solid fa-circle-info mt-0.5 mr-2 text-base"></i>
                <div>偵測到您未使用 LINE 開啟，請使用員工工號與密碼登入。（預設密碼為您的聯絡電話）</div>
            </div>
            <form onsubmit="handlePasswordLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">員工編號 (工號)</label>
                    <div class="relative">
                        <i class="fa-solid fa-user-badge absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="login-empId" required placeholder="例如：001" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 font-mono">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">登入密碼</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input type="password" id="login-password" required placeholder="請輸入密碼" class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-medium text-sm transition-all shadow-md shadow-indigo-100">
                    安全驗證登入
                </button>
            </form>
        </div>

        <div id="punch-view" class="hidden space-y-5">
            <div class="bg-indigo-50 rounded-2xl p-4 flex justify-between items-center">
                <div>
                    <p class="text-xs text-indigo-500 font-semibold font-mono" id="user-empid">EMP_ID</p>
                    <h2 class="text-lg font-bold text-gray-800" id="user-name">員工姓名</h2>
                </div>
                <span class="bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-lg font-semibold" id="login-method-tag">LINE 認證</span>
            </div>

            <div class="text-center bg-gray-50 rounded-xl py-3 border border-gray-100">
                <div id="clock-time" class="text-2xl font-bold font-mono text-gray-800">00:00:00</div>
                <div id="clock-date" class="text-xs text-gray-400 font-medium mt-0.5">2026 年 06 月 14 日</div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">打卡備註說明 (選填)</label>
                <input type="text" id="punch-memo" placeholder="外勤公出、遲到說明等..." class="w-full px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="executePunch('上班')" class="bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-bold text-base transition-all shadow-lg shadow-emerald-50 text-center block">
                    <i class="fa-solid fa-sun text-xl block mb-1"></i>上班打卡
                </button>
                <button onclick="executePunch('下班')" class="bg-gray-700 hover:bg-gray-800 text-white py-4 rounded-2xl font-bold text-base transition-all shadow-lg shadow-gray-100 text-center block">
                    <i class="fa-solid fa-moon text-xl block mb-1"></i>下班打卡
                </button>
            </div>
        </div>

    </div>

    <script>
        const GAS_URL = SYSTEM_ENV.GAS_WEB_APP_URL;
        let CURRENT_USER = null; // 儲存登入成功的員工物件

        window.onload = function() {
            if (SYSTEM_ENV.COMPANY_NAME) {
                document.getElementById('company-title').innerText = SYSTEM_ENV.COMPANY_NAME + " 行動打卡";
            }
            
            // 啟動即時時鐘
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock-time').innerText = now.toTimeString().split(' ')[0];
                document.getElementById('clock-date').innerText = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
            }, 1000);

            // 初始化 LINE LIFF
            initLiffSystem();
        };

        // 初始化 LIFF 系統並自動判定環境
        function initLiffSystem() {
            if (!SYSTEM_ENV.LIFF_ID || SYSTEM_ENV.LIFF_ID.includes("XXXX")) {
                // 如果環境檔沒設 LIFF，直接降級進入網頁帳密登入模式
                showLoginView();
                return;
            }

            liff.init({ liffId: SYSTEM_ENV.LIFF_ID })
                .then(() => {
                    // 💡 關鍵判斷：檢查員工是否是在 LINE App 內部開啟
                    if (liff.isInClient()) {
                        liff.getProfile().then(profile => {
                            const lineUid = profile.userId;
                            verifyEmployeeByLineUid(lineUid); // 走 LINE UID 自動綁定登入
                        }).catch(() => {
                            showLoginView(); // 抓不到 Profile 轉傳統登入
                        });
                    } else {
                        // 如果是用一般瀏覽器（Chrome/Safari）打開，直接顯示帳密登入
                        showLoginView();
                    }
                })
                .catch(err => {
                    console.error("LIFF 初始化失敗:", err);
                    showLoginView();
                });
        }

        // 1. 透過 LINE UID 進行 1 對 1 綁定登入
        function verifyEmployeeByLineUid(uid) {
            const url = `${GAS_URL}?action=verifyLogin&lineUid=${encodeURIComponent(uid)}&_t=${new Date().getTime()}`;
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        CURRENT_USER = res.data;
                        showPunchView("LINE 自動認證");
                    } else {
                        // 有 LINE UID 但資料庫對不到資料（尚未綁定）
                        alert(`⚠️ 登入失敗：\n系統查無此 LINE 帳號的綁定資料。\n您的 LINE UID 為:\n${uid}\n\n請聯繫管理員在後台將此 UID 填入您的員工檔案中！`);
                        document.getElementById('loading-view').innerHTML = `<div class="text-sm text-red-500 font-medium p-4">❌ 尚未開通權限，請將 UID 提供給管理員。</div>`;
                    }
                })
                .catch(() => showLoginView());
        }

        // 2. 傳統帳號密碼登入處理
        function handlePasswordLogin(event) {
            event.preventDefault();
            const empId = document.getElementById('login-empId').value.trim();
            const password = document.getElementById('login-password').value.trim();

            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            const url = `${GAS_URL}?action=verifyPasswordLogin&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}&_t=${new Date().getTime()}`;
            
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        CURRENT_USER = res.data;
                        CURRENT_USER.empId = empId; // 確保帶入正確工號
                        showPunchView("帳密安全登入");
                    } else {
                        alert("❌ 登入失敗：" + res.message);
                        document.getElementById('loading-view').classList.add('hidden');
                        document.getElementById('login-view').classList.remove('hidden');
                    }
                })
                .catch(() => {
                    alert("網路連線異常");
                    showLoginView();
                });
        }

        // 執行打卡動作 (傳送至後端儲存)
        function executePunch(type) {
            if (!CURRENT_USER) return alert("認證逾期，請重新整理網頁");
            
            const memo = document.getElementById('punch-memo').value.trim();
            
            // 打卡傳送的封包
            const punchData = {
                action: "addAttendanceLog", // 對應您後端原有的打卡紀錄 action
                empId: CURRENT_USER.empId,
                name: CURRENT_USER.name,
                type: type,
                memo: memo
            };

            // 注意：這裡假設您的後端有一個 doPost 可以接收 action: "addAttendanceLog"
            // 請確保後端對應的寫入打卡工作表邏輯正常
            fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify(punchData)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert(`🎉 【${CURRENT_USER.name}】${type}打卡成功！\n時間：${new Date().toLocaleTimeString()}`);
                    document.getElementById('punch-memo').value = ""; // 清空備註
                } else {
                    alert("打卡失敗：" + res.message);
                }
            })
            .catch(() => alert("打卡失敗，請檢查網路連線或 GAS 權限設定。"));
        }

        // 介面切換輔助
        function showLoginView() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('punch-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        }

        function showPunchView(methodName) {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('login-view').classList.add('hidden');
            
            document.getElementById('user-empid').innerText = "工號：" + CURRENT_USER.empId;
            document.getElementById('user-name').innerText = CURRENT_USER.name;
            document.getElementById('login-method-tag').innerText = methodName;
            
            document.getElementById('punch-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
