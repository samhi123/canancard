<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人事後台管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans h-screen flex flex-col md:flex-row overflow-hidden">

    <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between md:hidden shrink-0 shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-gears text-indigo-400 text-lg"></i>
            <span class="font-bold tracking-wide text-sm">人事後台</span>
        </div>
        <div class="flex space-x-2">
            <button onclick="switchTab('approval')" id="mbn-approval" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold transition">
                待審核 <span id="mbadge-count" class="bg-red-500 text-white px-1.5 py-0.2 rounded-full hidden text-[10px]">0</span>
            </button>
            <button onclick="switchTab('records')" id="mbn-records" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-400 text-xs font-medium transition">
                出勤報表
            </button>
        </div>
    </div>

    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shrink-0 hidden md:flex">
        <div>
            <div class="p-5 bg-slate-950 flex items-center space-x-3 text-white">
                <i class="fa-solid fa-gears text-indigo-400 text-xl"></i>
                <span class="font-bold text-lg tracking-wide">人事管理後台</span>
            </div>
            <div class="p-4 bg-slate-800/50 border-b border-slate-800 flex items-center space-x-3">
                <div class="w-9 h-9 bg-emerald-600 rounded-full flex items-center justify-center text-white font-bold text-sm">美</div>
                <div>
                    <p class="text-sm font-bold text-white">李四美 (HR)</p>
                    <p class="text-xs text-slate-400">系統管理員</p>
                </div>
            </div>
            <nav class="p-3 space-y-1">
                <button onclick="switchTab('approval')" id="btn-approval" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm transition">
                    <i class="fa-solid fa-clipboard-check text-base w-5"></i>
                    <span>待審核表單</span>
                    <span class="ml-auto bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden" id="badge-count">0</span>
                </button>
                <button onclick="switchTab('records')" id="btn-records" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 font-medium text-sm transition">
                    <i class="fa-solid fa-calendar-days text-base w-5"></i>
                    <span>出缺勤報表</span>
                </button>
            </nav>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-14 md:h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-6 shrink-0">
            <h1 class="font-bold text-gray-800 text-base md:text-lg" id="current-title">待審核表單中心</h1>
            <span class="text-xs md:text-sm text-gray-500 font-mono" id="live-time">2026-06-12 00:00:00</span>
        </header>

        <div class="p-3 md:p-6 flex-1 overflow-y-auto">
            
            <section id="tab-approval" class="space-y-4">
                <div class="hidden md:block bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                            <tr>
                                <th class="p-4">申請人</th>
                                <th class="p-4">表單類型</th>
                                <th class="p-4">詳細時間與時數</th>
                                <th class="p-4">事由 / 備註</th>
                                <th class="p-4 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody id="approval-list-tbody-desktop" class="divide-y divide-gray-100 text-gray-700">
                            <tr>
                                <td colspan="5" class="p-8 text-center text-gray-400">
                                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>正在等待本地設定檔加載...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="approval-list-container-mobile" class="block md:hidden space-y-3">
                    <div class="text-center text-gray-400 py-8 bg-white rounded-xl border">
                        <i class="fa-solid fa-spinner fa-spin mr-2"></i>正在載入資料...
                    </div>
                </div>
            </section>

            <section id="tab-records" class="hidden space-y-4">
                <div class="bg-white p-3 md:p-4 rounded-xl border border-gray-200 shadow-sm flex items-center">
                    <button onclick="loadAttendanceReports()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow-sm transition">
                        <i class="fa-solid fa-magnifying-glass mr-1"></i>重新整理報表
                    </button>
                </div>
                
                <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm min-w-[600px]">
                            <thead class="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                                <tr>
                                    <th class="p-4">姓名/工號</th>
                                    <th class="p-4">日期</th>
                                    <th class="p-4">打卡時間</th>
                                    <th class="p-4">打卡類型</th>
                                    <th class="p-4">備註</th>
                                </tr>
                            </thead>
                            <tbody id="report-list-tbody" class="divide-y divide-gray-100 text-gray-700">
                                <tr><td colspan="5" class="p-4 text-center text-gray-400">點擊上方按鈕載入出勤日誌</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // --- 1. 全域變數宣告 ---
        let GAS_WEB_APP_URL = "";
        const currentAdminName = "李四美"; 

        // --- 2. 網頁事件監聽 ---
        window.addEventListener('DOMContentLoaded', () => {
            startLiveTime();
            
            // 安全載入環境變數 env.txt
            fetch('env.txt')
                .then(response => {
                    if (!response.ok) throw new Error('找不到 env.txt 檔案');
                    return response.text();
                })
                .then(url => {
                    GAS_WEB_APP_URL = url.trim();
                    console.log("後台 GAS 網址加載成功:", GAS_WEB_APP_URL);
                    fetchPendingForms(); 
                })
                .catch(error => {
                    console.error("後台初始化失敗:", error);
                    const errMsg = `<tr><td colspan="5" class="p-4 text-center text-red-500 font-bold">⚠️ 錯誤：無法載入 env.txt。</td></tr>`;
                    document.getElementById('approval-list-tbody-desktop').innerHTML = errMsg;
                    document.getElementById('approval-list-container-mobile').innerHTML = `<div class="p-4 text-center text-red-500 font-bold">⚠️ 錯誤：無法載入 env.txt。</div>`;
                });
        });

        // --- 3. 核心功能函式定義 ---
        function fetchPendingForms() {
            if (!GAS_WEB_APP_URL) return;
            const tbody = document.getElementById('approval-list-tbody-desktop');
            const mContainer = document.getElementById('approval-list-container-mobile');
            const loadingHtml = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>正在從雲端拉取申請單...`;
            
            tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-400">${loadingHtml}</td></tr>`;
            mContainer.innerHTML = `<div class="text-center text-gray-400 py-8 bg-white rounded-xl border">${loadingHtml}</div>`;

            fetch(`${GAS_WEB_APP_URL}?action=getPendingForms`)
            .then(response => response.json())
            .then(res => {
                if (res.status === "success") {
                    renderApprovalInterface(res.data);
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">載入失敗：${res.message}</td></tr>`;
                    mContainer.innerHTML = `<div class="p-4 text-center text-red-500">載入失敗：${res.message}</div>`;
                }
            })
            .catch(error => {
                console.error("撈取失敗:", error);
                const connErr = "無法連線至雲端資料庫。請檢查 GAS 部署設定。";
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">${connErr}</td></tr>`;
                mContainer.innerHTML = `<div class="p-4 text-center text-red-500">${connErr}</div>`;
            });
        }

        // 同時渲染 電腦表格版 與 手機卡片版
        function renderApprovalInterface(forms) {
            const tbody = document.getElementById('approval-list-tbody-desktop');
            const mContainer = document.getElementById('approval-list-container-mobile');
            const badge = document.getElementById('badge-count');
            const mBadge = document.getElementById('mbadge-count');
            
            if (!forms || forms.length === 0) {
                const emptyHtml = `<i class="fa-solid fa-circle-check text-emerald-500 mr-2"></i>目前沒有待審核的表單。`;
                tbody.innerHTML = `<tr><td colspan="
