<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨所差勤數據整合後台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.liff.line.me/edge/2/sdk.js"></script>
    <script src="env.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-xl shadow-md">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <div>
                <h1 class="font-bold text-base tracking-wide">迦南科技管理部</h1>
                <p class="text-[10px] text-slate-400">跨所差勤數據整合中心 (最高管理員)</p>
            </div>
        </div>
        <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition-colors">
            <i class="fa-solid fa-arrow-left mr-1"></i> 回打卡首頁
        </a>
    </nav>

    <div id="loading-view" class="fixed inset-0 bg-slate-100 flex flex-col justify-center items-center z-50">
        <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center">
            <i class="fa-solid fa-shield-halved animate-spin text-3xl text-indigo-600 mb-3"></i>
            <p class="text-sm font-semibold text-slate-700">正在執行管理員安全環境驗證...</p>
        </div>
    </div>

    <div id="admin-login-modal" class="hidden fixed inset-0 bg-slate-100 flex flex-col justify-center items-center px-4 z-40">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center space-y-4 border border-slate-200">
            <div class="w-16 h-16 bg-slate-50 text-slate-700 rounded-full flex items-center justify-center text-2xl mx-auto shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h3 class="text-base font-bold text-slate-800">管理員手動登入</h3>
                <p class="text-xs text-slate-400 mt-1">系統偵測到非 LINE 環境，請執行安全驗證</p>
            </div>
            <form onsubmit="handleAdminPasswordLogin(event)" class="space-y-3 text-left">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">管理員工號</label>
                    <input type="text" id="admin-empId" required placeholder="例如: 001" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 mb-1">管理員密碼</label>
                    <input type="password" id="admin-password" required placeholder="請輸入密碼" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md">
                    驗證並登入後台
                </button>
            </form>
        </div>
    </div>

    <main id="admin-dashboard" class="hidden flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200/80 flex items-center space-x-4">
                <div class="p-3 bg-indigo-50 text-indigo-600 rounded-lg text-xl"><i class="fa-solid fa-users"></i></div>
                <div>
                    <p class="text-xs text-slate-400 font-medium">今日跨所總打卡</p>
                    <p id="stat-total-count" class="text-xl font-bold text-slate-800 mt-0.5">0 筆</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200/80 flex items-center space-x-4">
                <div class="p-3 bg-emerald-50 text-emerald-600 rounded-lg text-xl"><i class="fa-solid fa-circle-check"></i></div>
                <div>
                    <p class="text-xs text-slate-400 font-medium">今日上班報到</p>
                    <p id="stat-on-count" class="text-xl font-bold text-slate-800 mt-0.5">0 人</p>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200/80 flex items-center space-x-4">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg text-xl"><i class="fa-solid fa-hourglass-half"></i></div>
                <div>
                    <p class="text-xs text-slate-400 font-medium">待審核單據總數</p>
                    <p id="stat-pending-count" class="text-xl font-bold text-amber-600 mt-0.5">0 筆</p>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200/80 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <h2 class="font-bold text-slate-800 text-sm flex items-center"><i class="fa-solid fa-sliders mr-2 text-indigo-500"></i> 後台全局數據篩選中心</h2>
            <div class="flex items-center space-x-2 w-full md:w-auto">
                <label class="text-xs text-slate-400 whitespace-nowrap">切換所別：</label>
                <select id="office-filter" onchange="filterAllDataByOffice()" class="text-xs px-3 py-1.5 border border-slate-200 rounded-lg bg-slate-50 font-medium focus:outline-none">
                    <option value="ALL">全部所別 (跨所聯查)</option>
                </select>
            </div>
        </div>

        <div class="space-y-3">
            <div class="flex items-center space-x-2">
                <span class="w-1.5 h-5 bg-amber-500 rounded-full"></span>
                <h3 class="text-sm font-bold text-slate-800">人事表單線上簽核審查</h3>
            </div>
            <div class="bg-white rounded-xl shadow-xs border border-slate-200/80 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold tracking-wider">
                                <th class="p-3.5">申請時間</th>
                                <th class="p-3.5">所別</th>
                                <th class="p-3.5">姓名(工號)</th>
                                <th class="p-3.5">假別/單據</th>
                                <th class="p-3.5">申請詳細說明</th>
                                <th class="p-3.5">當前狀態</th>
                                <th class="p-3.5 text-center">決策控制</th>
                            </tr>
                        </thead>
                        <tbody id="form-review-tbody" class="divide-y divide-slate-100 text-slate-600 font-medium">
                            <tr>
                                <td colspan="7" class="text-center py-6 text-slate-400">正在載入待審核表單清單...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <div class="flex items-center space-x-2">
                <span class="w-1.5 h-5 bg-indigo-600 rounded-full"></span>
                <h3 class="text-sm font-bold text-slate-800">全所別當日打卡明細</h3>
            </div>
            <div class="bg-white rounded-xl shadow-xs border border-slate-200/80 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold tracking-wider">
                                <th class="p-3.5">打卡時間</th>
                                <th class="p-3.5">所別</th>
                                <th class="p-3.5">工號</th>
                                <th class="p-3.5">姓名</th>
                                <th class="p-3.5">類型</th>
                                <th class="p-3.5">打卡備註說明</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-tbody" class="divide-y divide-slate-100 text-slate-600 font-medium">
                            <tr>
                                <td colspan="6" class="text-center py-6 text-slate-400">正在讀取今日打卡數據...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-4 text-[10px] text-slate-400 tracking-wide">
        © 2026 迦南科技管理部 · 總部大數據中心
    </footer>

    <script>
        let rawAttendanceData = [];
        let rawFormData = [];

        window.onload = function() {
            initAdminSecurityCheck();
        };

        // 第一關：自動安全比對
        function initAdminSecurityCheck() {
            if (!navigator.userAgent.includes("Line") && !navigator.userAgent.includes("LIFF")) {
                showLoginModalView();
                return;
            }
            liff.init({ liffId: SYSTEM_ENV.LIFF_ID })
                .then(() => {
                    if (liff.isInClient() || liff.isLoggedIn()) {
                        liff.getProfile().then(profile => {
                            let url = `${SYSTEM_ENV.GAS_WEB_APP_URL}?action=verifyLogin&lineUid=${encodeURIComponent(profile.userId)}`;
                            fetch(url).then(res => res.json()).then(res => {
                                if (res.status === "success" && res.data && res.data.權限設定 === "Admin") {
                                    unlockAdminDashboard();
                                } else {
                                    showLoginModalView();
                                }
                            }).catch(() => showLoginModalView());
                        }).catch(() => showLoginModalView());
                    } else {
                        showLoginModalView();
                    }
                }).catch(() => showLoginModalView());
        }

        // 第二關：手動帳密登入與 Admin 權限判定
        function handleAdminPasswordLogin(event) {
            event.preventDefault();
            const empId = document.getElementById('admin-empId').value.trim();
            const password = document.getElementById('admin-password').value.trim();

            document.getElementById('admin-login-modal').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            let url = `${SYSTEM_ENV.GAS_WEB_APP_URL}?action=verifyPasswordLogin&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}`;

            fetch(url).then(res => res.json()).then(res => {
                if (res.status === "success" && res.data && res.data.權限設定 === "Admin") {
                    unlockAdminDashboard();
                } else {
                    triggerAccessDenied("安全阻斷：此帳密正確，但該帳號不具備最高管理員(Admin)權限。");
                }
            }).catch(() => {
                triggerAccessDenied("通訊失敗：請確認後端 GAS 設定並重新發布新版本。");
            });
        }

        function showLoginModalView() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-login-modal').classList.remove('hidden');
        }

        function unlockAdminDashboard() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('admin-login-modal').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            fetchAllBackendData(); // 載入所有明細與審核表單
        }

        function triggerAccessDenied(message) {
            alert(message);
            window.location.href = "index.html";
        }

        // 統一向後端抓取「打卡記錄」與「表單申請紀錄」
        function fetchAllBackendData() {
            // 1. 抓取打卡
            fetch(`${SYSTEM_ENV.GAS_WEB_APP_URL}?action=getAllAttendanceLogs`)
                .then(res => res.json()).then(res => {
                    if(res.status === "success") {
                        rawAttendanceData = res.data;
                        buildOfficeFilterOptions(res.data);
                        renderAttendanceTable(res.data);
                        calculateAttendanceStats(res.data);
                    }
                });

            // 2. 抓取待審核表單
            fetch(`${SYSTEM_ENV.GAS_WEB_APP_URL}?action=getFormApplications`)
                .then(res => res.json()).then(res => {
                    if(res.status === "success") {
                        rawFormData = res.data;
                        renderFormTable(res.data);
                    }
                });
        }

        // 動態產出所別選單
        function buildOfficeFilterOptions(data) {
            const offices = new Set();
            data.forEach(row => { if(row.office) offices.add(row.office); });
            const filterSelect = document.getElementById('office-filter');
            filterSelect.innerHTML = '<option value="ALL">全部所別 (跨所聯查)</option>';
            offices.forEach(office => {
                const opt = document.createElement('option');
                opt.value = office; opt.innerText = office;
                filterSelect.appendChild(opt);
            });
        }

        // 聯動篩選
        function filterAllDataByOffice() {
            const office = document.getElementById('office-filter').value;
            if(office === "ALL") {
                renderAttendanceTable(rawAttendanceData);
                renderFormTable(rawFormData);
            } else {
                renderAttendanceTable(rawAttendanceData.filter(r => r.office === office));
                renderFormTable(rawFormData.filter(r => r.office === office));
            }
        }

        // 渲染打卡明細
        function renderAttendanceTable(data) {
            const tbody = document.getElementById('attendance-tbody');
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">📅 目前無打卡數據</td></tr>`;
                return;
            }
            tbody.innerHTML = data.map(row => {
                const typeClass = row.type === "上班" ? "text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded" : "text-slate-600 bg-slate-100 px-2 py-0.5 rounded";
                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3.5 text-slate-500 font-mono">${row.timestamp}</td>
                        <td class="p-3.5"><span class="bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-semibold">${row.office}</span></td>
                        <td class="p-3.5 font-mono">${row.empId}</td>
                        <td class="p-3.5 text-slate-800 font-bold">${row.name}</td>
                        <td class="p-3.5"><span class="${typeClass}">${row.type}</span></td>
                        <td class="p-3.5 text-slate-400 max-w-xs truncate">${row.memo || "—"}</td>
                    </tr>
                `;
            }).join('');
        }

        // 🔥 🔥 渲染人事申請審核表
        function renderFormTable(data) {
            const tbody = document.getElementById('form-review-tbody');
            if(data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-400">☕ 目前無任何假單或加班申請單據</td></tr>`;
                return;
            }

            // 更新首頁待審核筆數統計
            const pendingCount = data.filter(r => r.status === "待審核").length;
            document.getElementById('stat-pending-count').innerText = `${pendingCount} 筆`;

            tbody.innerHTML = data.map(row => {
                let statusBadge = `<span class="bg-amber-50 text-amber-600 px-2 py-0.5 rounded">待審核</span>`;
                if(row.status === "已通過") statusBadge = `<span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded">已通過</span>`;
                if(row.status === "已拒絕") statusBadge = `<span class="bg-rose-50 text-rose-600 px-2 py-0.5 rounded">已拒絕</span>`;

                // 如果是待審核，才顯示控制按鈕
                let controlButtons = `—`;
                if(row.status === "待審核") {
                    controlButtons = `
                        <div class="flex items-center justify-center space-x-2">
                            <button onclick="submitReview(${row.rowId}, '已通過')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] px-2.5 py-1 rounded shadow-xs transition-colors"><i class="fa-solid fa-check mr-1"></i>核准</button>
                            <button onclick="submitReview(${row.rowId}, '已拒絕')" class="bg-rose-500 hover:bg-rose-600 text-white text-[11px] px-2.5 py-1 rounded shadow-xs transition-colors"><i class="fa-solid fa-xmark mr-1"></i>駁回</button>
                        </div>
                    `;
                }

                return `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3.5 text-slate-500 font-mono">${row.timestamp}</td>
                        <td class="p-3.5"><span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${row.office}</span></td>
                        <td class="p-3.5 text-slate-800 font-bold">${row.name} <span class="text-[10px] text-slate-400 font-mono">(${row.empId})</span></td>
                        <td class="p-3.5"><span class="bg-amber-50 text-amber-700 font-bold px-1.5 py-0.5 rounded border border-amber-200/50">${row.formType}</span></td>
                        <td class="p-3.5 text-slate-600 max-w-sm break-all">${row.details}</td>
                        <td class="p-3.5">${statusBadge}</td>
                        <td class="p-3.5 text-center">${controlButtons}</td>
                    </tr>
                `;
            }).join('');
        }

        // 🔥 🔥 線上發送審核決策
        function submitReview(rowId, status) {
            if(!confirm(`確定要將此單據設為【${status}】嗎？`)) return;

            let url = `${SYSTEM_ENV.GAS_WEB_APP_URL}?action=reviewApplication&rowId=${rowId}&status=${encodeURIComponent(status)}`;
            
            fetch(url).then(res => res.json()).then(res => {
                if(res.status === "success") {
                    alert("審核完成！單據已更新。");
                    fetchAllBackendData(); // 重新刷洗資料，即時更新畫面狀態
                } else {
                    alert(`審核失敗：${res.message}`);
                }
            }).catch(() => alert("通訊出錯，無法連結 Google 試算表。"));
        }

        function calculateAttendanceStats(data) {
            document.getElementById('stat-total-count').innerText = `${data.length} 筆`;
            const onCount = data.filter(row => row.type === "上班").length;
            document.getElementById('stat-on-count').innerText = `${onCount} 人`;
        }
    </script>
</body>
</html>
