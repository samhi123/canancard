<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨所差勤數據整合後台</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://static.liff.line.me/edge/2/sdk.js"></script>
    <script src="env.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen">

    <div id="loading-view" class="fixed inset-0 bg-slate-900/10 backdrop-blur-xs flex flex-col justify-center items-center z-50">
        <i class="fa-solid fa-shield-halved animate-bounce text-4xl text-indigo-600 mb-3"></i>
        <p class="text-sm font-semibold text-slate-700">正在執行管理員環境安全驗證...</p>
    </div>

    <div id="login-view" class="hidden min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl mx-auto mb-2 shadow-sm">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">後台管理安全驗證</h2>
                <p class="text-xs text-slate-400 mt-1">系統偵測到非 LINE 環境，請輸入核心管理憑證</p>
            </div>
            
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">管理員編號 (工號)</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-card-clip absolute left-3 top-3 text-slate-400"></i>
                        <input type="text" id="admin-empId" required placeholder="請輸入工號" class="w-full pl-9 pr-3 py-2 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">管理密碼</label>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-3 top-3 text-slate-400"></i>
                        <input type="password" id="admin-password" required placeholder="請輸入後台核心密碼" class="w-full pl-9 pr-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md shadow-indigo-100">
                    驗證權限並登入
                </button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden">
        <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <span class="bg-indigo-600 text-[10px] px-2 py-0.5 rounded font-bold tracking-wider">多所整合</span>
                <h1 class="font-bold text-base md:text-lg">雲端差勤數據整合後台</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span class="text-xs md:text-sm text-slate-300">
                    目前管理員：<span id="current-admin-name" class="font-bold text-white">---</span> 
                    【<span id="current-admin-office" class="text-indigo-400 font-medium">---</span>】
                </span>
                <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-red-400 font-medium transition-colors flex items-center space-x-1">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="hidden md:inline">安全登出</span>
                </button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto px-4 py-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">全所別員工打卡即時數據</h2>
                        <p class="text-xs text-slate-400 mt-0.5">系統已自動啟用跨事務所多租戶資料庫串接</p>
                    </div>
                </div>
                
                <div class="border border-slate-100 rounded-xl bg-slate-50 p-8 text-center text-slate-400 text-sm">
                    <i class="fa-solid fa-chart-pie text-3xl mb-2 text-indigo-500/80 block"></i>
                    <span class="text-slate-700 font-semibold block mb-1">🎉 權限安全校驗成功！</span>
                    管理員環境已開通。後台已具備「自動新增欄位」與「跨所別隔離」功能，功能運作完全正常。
                </div>
            </div>
        </main>
    </div>

    <script>
        const GAS_URL = SYSTEM_ENV.GAS_WEB_APP_URL;

        window.onload = function() {
            // 網頁一打開，立刻執行與前台完全相同的 LINE 雙模安全安檢機制
            initAdminSecurityCheck();
        };

        // 核心機制：後台專用 LINE 自動偵測與安全降級防護
        function initAdminSecurityCheck() {
            // 【安全防線 1】：如果根本連不上 LINE 伺服器，導致 liff 套件不存在，秒切換帳密登入
            if (typeof liff === "undefined") {
                console.warn("後台提示：LINE SDK 未載入，切換至密碼登入。");
                switchToLoginView();
                return;
            }

            // 【安全防線 2】：如果網頁不是在 LINE App 內部打開，不等待 LIFF，直接彈出密碼登入框
            if (!navigator.userAgent.includes("Line") && !navigator.userAgent.includes("LIFF")) {
                console.log("後台提示：偵測到為一般網頁瀏覽器，直接啟動密碼登入。");
                switchToLoginView();
                return;
            }

            // 【安全防線 3】：如果是 LINE 開啟，但環境設定沒有 LIFF ID，去密碼登入
            if (!SYSTEM_ENV.LIFF_ID || SYSTEM_ENV.LIFF_ID.includes("XXXX")) {
                switchToLoginView();
                return;
            }

            // 只有上述 LINE 條件完全通過，才執行自動無感登入
            try {
                liff.init({ liffId: SYSTEM_ENV.LIFF_ID })
                    .then(() => {
                        if (liff.isInClient()) {
                            liff.getProfile().then(profile => {
                                // 丟給後端驗證這個 LINE UID 是否在試算表中，且是否為 Admin
                                verifyAdminPrivilege(profile.userId, null, null, true);
                            }).catch(() => switchToLoginView());
                        } else {
                            switchToLoginView();
                        }
                    })
                    .catch(() => switchToLoginView());
            } catch (e) {
                switchToLoginView();
            }
        }

        // 處理非 LINE 環境的手動帳密登入
        function handleAdminLogin(event) {
            event.preventDefault();
            const empId = document.getElementById('admin-empId').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            
            // 轉入讀取中畫面
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('loading-view').classList.remove('hidden');

            verifyAdminPrivilege(null, empId, password, false);
        }

        // 統一安全權限交叉校驗
        function verifyAdminPrivilege(uid, empId, password, isLine) {
            let url = GAS_URL;
            if (isLine) {
                url += `?action=verifyLogin&lineUid=${encodeURIComponent(uid)}&_t=${new Date().getTime()}`;
            } else {
                url += `?action=verifyPasswordLogin&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}&_t=${new Date().getTime()}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(res => {
                    // 💡 關鍵三重安全卡關：必須成功、且該人員在試算表中的「權限」必須是 "Admin"
                    if (res.status === "success" && res.data.role === "Admin") {
                        document.getElementById('loading-view').classList.add('hidden');
                        document.getElementById('login-view').classList.add('hidden');
                        
                        // 動態填入經資料庫驗證成功的管理員名稱與他所隸屬的事務所所別
                        document.getElementById('current-admin-name').innerText = res.data.name;
                        document.getElementById('current-admin-office').innerText = res.data.office;
                        
                        // 打開主管理面板
                        document.getElementById('admin-dashboard').classList.remove('hidden');
                    } else {
                        alert("⚠️ 安全阻斷：\n您不具備最高管理員(Admin)權限，或者輸入的核心憑證有誤，系統拒絕存取。");
                        switchToLoginView();
                    }
                })
                .catch(() => {
                    alert("連線後端錯誤，請確認 GAS 是否正確發布。");
                    switchToLoginView();
                });
        }

        function switchToLoginView() {
            document.getElementById('loading-view').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        }

        function handleLogout() {
            window.location.reload();
        }
    </script>
</body>
</html>
