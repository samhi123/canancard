<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業雲端人事後台管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="env.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f9fafb; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        th, td { white-space: nowrap; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- 帳號密碼登入蓋板（LINE 無法偵測時顯示） -->
    <div id="admin-login-overlay" class="fixed inset-0 bg-gradient-to-br from-indigo-700 to-indigo-900 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xs w-full p-6 space-y-4">
            <div class="text-center">
                <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-user-shield text-2xl text-indigo-600"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-800">管理員登入</h2>
                <p id="admin-login-company-name" class="text-sm text-gray-400 mt-1">人事後台管理系統</p>
            </div>
            <div id="admin-login-debug-box" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-2 text-[11px] text-amber-700 leading-relaxed break-all whitespace-pre-line"></div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">管理員工號</label>
                <input type="text" id="admin-login-empId" placeholder="請輸入管理員工號"
                    class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-300">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                <input type="password" id="admin-login-password" placeholder="請輸入密碼"
                    onkeydown="if(event.key==='Enter') loginAdminWithPassword()"
                    class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-300">
            </div>
            <p id="admin-login-error-msg" class="text-xs text-red-500 text-center hidden"></p>
            <button onclick="loginAdminWithPassword()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold py-2.5 rounded-xl transition-all shadow-md">
                <i class="fa-solid fa-right-to-bracket mr-2"></i>登入後台
            </button>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-200 pb-4 mb-6 gap-2">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">
                    <i class="fa-solid fa-user-shield text-indigo-600 mr-2"></i>
                    <span id="ui-company-name">人事後台管理中心</span>
                </h1>
                <p class="text-sm text-gray-500 mt-1">權限角色：<span id="admin-role-tag" class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-xs font-semibold">環境載入中...</span></p>
            </div>
            <div class="text-right">
                <span id="current-time-clock" class="text-sm font-mono text-gray-500 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-gray-100"></span>
            </div>
        </div>

        <div class="flex space-x-2 mb-6 bg-gray-100 p-1 rounded-xl w-fit">
            <button onclick="switchTab('pending-section')" id="btn-pending-section" class="tab-btn bg-white text-gray-800 px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition-all">
                <i class="fa-solid fa-file-signature mr-1"></i>待審核單據
            </button>
            <button onclick="switchTab('hr-section')" id="btn-hr-section" class="tab-btn text-gray-600 hover:text-gray-900 px-4 py-2 rounded-lg text-sm font-medium transition-all">
                <i class="fa-solid fa-users-gear mr-1"></i>人事檔案維護
            </button>
            <button onclick="switchTab('report-section')" id="btn-report-section" class="tab-btn text-gray-600 hover:text-gray-900 px-4 py-2 rounded-lg text-sm font-medium transition-all">
                <i class="fa-solid fa-business-time mr-1"></i>歷史出勤報表
            </button>
        </div>

        <div id="pending-section" class="tab-content bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">即時待審名單</h2>
                <button onclick="loadPendingForms()" class="text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg font-medium transition-all">
                    <i class="fa-solid fa-rotate mr-1"></i>重新整理
                </button>
            </div>
            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm font-semibold border-b border-gray-100">
                            <th class="p-3">申請人</th>
                            <th class="p-3">表單類型</th>
                            <th class="p-3">詳細時間與時數</th>
                            <th class="p-3">事由 / 備註</th>
                            <th class="p-3 text-center">審核決策</th>
                        </tr>
                    </thead>
                    <tbody id="pending-table-body" class="text-gray-700 text-sm divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>

        <div id="hr-section" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                <h2 class="text-lg font-bold text-gray-700">全體員工清單</h2>
                <div class="flex flex-wrap gap-2">
                    <button onclick="copyLiffUrl()" class="border border-indigo-200 hover:bg-indigo-50 text-indigo-600 text-sm px-3 py-2 rounded-xl font-medium transition-all shadow-sm">
                        <i class="fa-solid fa-copy mr-1"></i>複製員工 LIFF 綁定網址
                    </button>
                    <button onclick="openHREditModal()" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded-xl font-medium transition-all shadow-sm shadow-green-100">
                        <i class="fa-solid fa-user-plus mr-1"></i>新增員工檔案
                    </button>
                </div>
            </div>
            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm font-semibold border-b border-gray-100">
                            <th class="p-3">工號/姓名</th>
                            <th class="p-3">部門/職稱</th>
                            <th class="p-3">聯絡電話</th>
                            <th class="p-3">LINE UID</th>
                            <th class="p-3">狀態/權限</th>
                            <th class="p-3 text-center" style="width: 180px; min-w: 180px;">基本操作</th>
                        </tr>
                    </thead>
                    <tbody id="hr-table-body" class="text-gray-700 text-sm divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>

        <div id="report-section" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">全體歷史打卡追蹤</h2>
                <button onclick="loadAttendanceReports()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-medium transition-all">
                    <i class="fa-solid fa-rotate mr-1"></i>重新整理
                </button>
            </div>
            <!-- 篩選列 -->
            <div class="flex flex-wrap gap-2 mb-4 p-3 bg-gray-50 rounded-xl">
                <div class="flex items-center gap-1.5">
                    <label class="text-xs text-gray-500 whitespace-nowrap">員工</label>
                    <select id="report-filter-emp" class="border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-400 bg-white min-w-[120px]">
                        <option value="">全部員工</option>
                    </select>
                </div>
                <div class="flex items-center gap-1.5">
                    <label class="text-xs text-gray-500 whitespace-nowrap">日期從</label>
                    <input type="date" id="report-filter-start" class="border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-400 bg-white">
                </div>
                <div class="flex items-center gap-1.5">
                    <label class="text-xs text-gray-500 whitespace-nowrap">至</label>
                    <input type="date" id="report-filter-end" class="border border-gray-200 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:border-indigo-400 bg-white">
                </div>
                <button onclick="applyReportFilter()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-all">
                    <i class="fa-solid fa-magnifying-glass mr-1"></i>篩選
                </button>
                <button onclick="resetReportFilter()" class="border border-gray-200 hover:bg-gray-100 text-gray-600 px-3 py-1.5 rounded-lg text-sm font-medium transition-all">
                    清除
                </button>
                <button onclick="exportReportCSV()" class="ml-auto bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition-all">
                    <i class="fa-solid fa-file-csv mr-1"></i>匯出 CSV
                </button>
            </div>
            <p id="report-count" class="text-xs text-gray-400 mb-2"></p>
            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm font-semibold border-b border-gray-100">
                            <th class="p-3">員工編號</th>
                            <th class="p-3">姓名</th>
                            <th class="p-3">打卡日期</th>
                            <th class="p-3">打卡時間</th>
                            <th class="p-3">打卡類型</th>
                            <th class="p-3">打卡備註說明</th>
                        </tr>
                    </thead>
                    <tbody id="report-table-body" class="text-gray-700 text-sm divide-y divide-gray-50"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="hr-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-lg font-bold text-gray-800 mb-4">編輯員工資料</h3>
            <form id="hr-form" onsubmit="submitHRForm(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block text-gray-600 mb-1 font-medium">員工編號 <span class="text-red-400">*</span> (不可重複)</label>
                    <input type="text" id="form-empId" required oninput="checkEmpIdDuplicate()"
                        class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    <p id="empId-check-msg" class="text-xs mt-1 hidden"></p>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">姓名 <span class="text-red-400">*</span></label>
                        <input type="text" id="form-name" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">部門 <span class="text-red-400">*</span></label>
                        <input type="text" id="form-dept" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">職稱 <span class="text-red-400">*</span></label>
                        <input type="text" id="form-title" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">到職日期 <span class="text-red-400">*</span></label>
                        <input type="date" id="form-arrivalDate" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">聯絡電話</label>
                        <input type="text" id="form-phone" placeholder="若無請留空" class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">所別</label>
                        <input type="text" id="form-branch" placeholder="例：台北所" class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">基本薪資 <span class="text-red-400">*</span></label>
                        <input type="number" id="form-salary" min="0" step="1" placeholder="例：30000" required
                            class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">員工生日 <span class="text-red-400">*</span></label>
                        <input type="date" id="form-birthday" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 mb-1 font-medium">Email <span class="text-red-400">*</span></label>
                    <input type="email" id="form-email" required placeholder="example@company.com"
                        class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1 font-medium">LINE User ID</label>
                    <input type="text" id="form-lineUid" class="w-full border border-gray-200 rounded-xl px-3 py-2 font-mono focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1 font-medium">員工密碼 <span class="text-red-400">*</span> <span id="pwd-hint" class="text-gray-400 font-normal text-xs"></span></label>
                    <input type="text" id="form-password" placeholder="請設定員工登入密碼"
                        class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">在職狀態</label>
                        <select id="form-status" class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                            <option value="在職">在職</option>
                            <option value="離職">離職</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">系統權限設定</label>
                        <select id="form-role" class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                            <option value="User">User (一般員工)</option>
                            <option value="Admin">Admin (後台管理員)</option>
                        </select>
                    </div>
                </div>
                <div class="flex space-x-2 pt-4 justify-end">
                    <button type="button" onclick="closeHRModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-xl transition-all">取消</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl transition-all shadow-md">儲存人事檔案</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const APP_VERSION = "v1.0.6";
        const GAS_WEB_APP_URL = SYSTEM_ENV.GAS_WEB_APP_URL;
        const LIFF_ID = SYSTEM_ENV.LIFF_ID;
        let currentAdminLineUid = "";
        let currentAdminBranch = "";   // 登入後記下管理員所別
        let hrProfilesData = [];

        function showAdminPasswordLogin(debugInfo) {
            if (SYSTEM_ENV.COMPANY_NAME) {
                document.getElementById('admin-login-company-name').innerText = SYSTEM_ENV.COMPANY_NAME;
            }
            const debugBox = document.getElementById('admin-login-debug-box');
            if (debugInfo) {
                debugBox.innerText = debugInfo;
                debugBox.classList.remove('hidden');
            } else {
                debugBox.classList.add('hidden');
            }
            document.getElementById('admin-login-overlay').classList.remove('hidden');
            document.getElementById('admin-role-tag').innerText = `帳號密碼登入 ${APP_VERSION}`;
        }

        function loginAdminWithPassword() {
            const empId    = document.getElementById('admin-login-empId').value.trim();
            const password = document.getElementById('admin-login-password').value.trim();
            const errEl    = document.getElementById('admin-login-error-msg');

            if (!empId || !password) {
                errEl.innerText = "請輸入工號和密碼";
                errEl.classList.remove('hidden');
                return;
            }
            errEl.classList.add('hidden');

            fetch(`${GAS_WEB_APP_URL}?action=loginWithPassword&empId=${encodeURIComponent(empId)}&password=${encodeURIComponent(password)}`)
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success') {
                        if (res.data.role !== 'Admin') {
                            errEl.innerText = "此帳號不具備管理員權限";
                            errEl.classList.remove('hidden');
                            return;
                        }
                        // 帳號密碼登入成功，lineUid 留空（後端 isAdmin 將不再強制檢查）
                        currentAdminLineUid = "PWD_LOGIN:" + empId;
                        currentAdminBranch  = res.data.branch || "";
                        document.getElementById('admin-login-overlay').classList.add('hidden');
                        document.getElementById('admin-role-tag').innerText = `${res.data.name}｜${currentAdminBranch || '全所'}｜Admin ${APP_VERSION}`;
                        forcedFreshLoadHRProfiles(true); // true = 載完後串接待審單 & 出勤報表
                    } else {
                        errEl.innerText = res.message || "工號或密碼錯誤";
                        errEl.classList.remove('hidden');
                    }
                })
                .catch(() => {
                    errEl.innerText = "連線失敗，請稍後再試";
                    errEl.classList.remove('hidden');
                });
        }

        window.onload = function() {
            if (SYSTEM_ENV.COMPANY_NAME) {
                document.getElementById('ui-company-name').innerText = SYSTEM_ENV.COMPANY_NAME;
            }
            setInterval(() => {
                document.getElementById('current-time-clock').innerText = "⏱️ " + new Date().toLocaleString('zh-TW', {hour12:false});
            }, 1000);

            document.getElementById('admin-role-tag').innerText = `LINE 登入驗證中... ${APP_VERSION}`;

            // 初始化 LIFF，失敗或非 LINE 環境時改用帳號密碼登入
            if (typeof liff === "undefined") {
                showAdminPasswordLogin();
                return;
            }

            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    // 不在 LINE App 內（電腦瀏覽器），改用帳號密碼登入
                    if (!liff.isInClient() && !liff.isLoggedIn()) {
                        showAdminPasswordLogin();
                        return;
                    }
                    if (!liff.isLoggedIn()) {
                        liff.login();
                        return;
                    }
                    return liff.getProfile();
                })
                .then(profile => {
                    if (!profile) return;
                    currentAdminLineUid = profile.userId;
                    verifyAdminIdentity(profile.userId);
                })
                .catch(err => {
                    console.error("LIFF 初始化或登入失敗:", err);
                    // LIFF 初始化失敗，改用帳號密碼登入
                    showAdminPasswordLogin(`LIFF 初始化失敗：${err && err.message ? err.message : err}\n\n請確認 env.js 的 LIFF_ID 正確，且此網址已加入該 LIFF 的 Endpoint URL 白名單。`);
                });
        };

        function verifyAdminIdentity(lineUid) {
            const url = `${GAS_WEB_APP_URL}?action=verifyLogin&lineUid=${encodeURIComponent(lineUid)}&_t=${new Date().getTime()}`;
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    console.log("verifyAdminIdentity 回應:", res, "查詢的 lineUid:", lineUid);
                    if (res.status === "success" && res.data.role === "Admin") {
                        // LINE UID 比對成功且為 Admin → 直接登入
                        currentAdminBranch = res.data.branch || "";
                        document.getElementById('admin-role-tag').innerText = `${res.data.name}｜${currentAdminBranch || '全所'}｜Admin ${APP_VERSION}`;
                        forcedFreshLoadHRProfiles(true); // true = 載完後串接待審單 & 出勤報表
                    } else if (res.status === "success") {
                        // 找到員工，但不是 Admin 權限
                        showAdminPasswordLogin(`偵測到您的 LINE UID：\n${lineUid}\n\n此 UID 對應到員工「${res.data.name}」，但權限為「${res.data.role}」非 Admin，請至人事檔案將該員工的「系統權限設定」改為 Admin。`);
                    } else {
                        // GAS 已區分「找不到 UID」與「UID 找到但狀態非在職」兩種情況，直接顯示訊息
                        showAdminPasswordLogin(`偵測到您的 LINE UID：\n${lineUid}\n\n${res.message || '驗證失敗'}`);
                    }
                })
                .catch(err => {
                    console.error("verifyAdminIdentity 連線錯誤:", err);
                    // 連線失敗也改用帳號密碼登入，避免完全卡住無法使用
                    showAdminPasswordLogin(`連線 GAS 失敗：${err}\n\n請確認 GAS 已重新部署為最新版本，且 env.js 的 GAS_WEB_APP_URL 正確。`);
                });
        }

        function forcedFreshLoadHRProfiles(chainLoad = false) {
            const tbody = document.getElementById('hr-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-gray-400">更新資料中...</td></tr>`;

            const url = `${GAS_WEB_APP_URL}?action=getHRProfiles&lineUid=${encodeURIComponent(currentAdminLineUid)}&t=${new Date().getTime()}`;
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        hrProfilesData = res.data; // 全域快取（供其他區塊查詢 branch）

                        // 依所別過濾（無所別的管理員顯示全部）
                        const visible = currentAdminBranch
                            ? res.data.filter(e => e.branch === currentAdminBranch)
                            : res.data;

                        tbody.innerHTML = "";
                        visible.forEach(emp => {
                            const statusColor = emp.status === "在職" ? "bg-green-100 text-green-800" : "bg-red-100 text-red-800";
                            const roleColor   = emp.role === "Admin"  ? "bg-purple-100 text-purple-800" : "bg-gray-100 text-gray-800";
                            const safeEmpId   = emp.empId.toString().trim();

                            tbody.innerHTML += `
                                <tr class="hover:bg-gray-50/80 transition-colors">
                                    <td class="p-3 font-semibold text-gray-800">${emp.name}<br><span class="text-xs text-gray-400 font-mono">${safeEmpId}</span></td>
                                    <td class="p-3 text-sm text-gray-600">${emp.dept}<br><span class="text-xs text-gray-500">${emp.title}</span>${emp.branch ? `<br><span class="text-xs bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded">${emp.branch}</span>` : ''}</td>
                                    <td class="p-3 font-mono text-xs text-gray-600">${emp.phone}</td>
                                    <td class="p-3 font-mono text-xs text-gray-400">${emp.lineUid}</td>
                                    <td class="p-3 space-y-1">
                                        <span class="${statusColor} text-xs px-2 py-0.5 rounded-md font-medium block w-fit">${emp.status}</span>
                                        <span class="${roleColor} text-xs px-2 py-0.5 rounded-md font-medium block w-fit">${emp.role}</span>
                                    </td>
                                    <td class="p-3 text-center">
                                        <button onclick="openHREditModal('${safeEmpId}')" class="text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1.5 rounded-lg text-xs font-medium mr-1">
                                            <i class="fa-solid fa-user-pen mr-1"></i>編輯
                                        </button>
                                        <button onclick="deleteHRProfile('${safeEmpId}', '${emp.name}')" class="text-red-600 bg-red-50 hover:bg-red-100 px-2.5 py-1.5 rounded-lg text-xs font-medium">
                                            <i class="fa-solid fa-trash-can mr-1"></i>刪除
                                        </button>
                                    </td>
                                </tr>
                            `;
                        });

                        // 初次登入時，等 hrProfilesData 建立後再載入其他區塊（確保 branch 過濾可查到資料）
                        if (chainLoad) {
                            loadPendingForms();
                            loadAttendanceReports();
                        }
                    }
                });
        }

        function openHREditModal(empId = null) {
            const modal = document.getElementById('hr-modal');
            document.getElementById('hr-form').reset();

            if (empId) {
                document.getElementById('modal-title').innerText = "📝 編輯員工檔案";
                document.getElementById('form-empId').readOnly = true;
                document.getElementById('form-empId').className = "w-full border border-gray-200 bg-gray-50 text-gray-400 rounded-xl px-3 py-2 font-mono";
                
                // 比對時全部去除單引號與空白，精準尋找
                const targetId = empId.toString().replace(/^'/, "").trim();
                const emp = hrProfilesData.find(e => e.empId.toString().replace(/^'/, "").trim() === targetId);
                
                if (emp) {
                    document.getElementById('form-empId').value       = emp.empId;
                    document.getElementById('form-name').value        = emp.name;
                    document.getElementById('form-dept').value        = emp.dept;
                    document.getElementById('form-title').value       = emp.title;
                    document.getElementById('form-arrivalDate').value = emp.arrivalDate;
                    document.getElementById('form-phone').value       = emp.phone === "無" ? "" : emp.phone;
                    document.getElementById('form-branch').value      = emp.branch   || "";
                    document.getElementById('form-salary').value      = emp.salary   || "";
                    document.getElementById('form-birthday').value    = emp.birthday || "";
                    document.getElementById('form-email').value       = emp.email    || "";
                    document.getElementById('form-lineUid').value     = emp.lineUid;
                    document.getElementById('form-password').value    = emp.password || "";
                    document.getElementById('form-status').value      = emp.status;
                    document.getElementById('form-role').value        = emp.role;
                    // 編輯模式：密碼欄可留空表示不修改
                    document.getElementById('pwd-hint').innerText     = "（留空表示不修改）";
                    document.getElementById('form-password').removeAttribute('required');
                }
            } else {
                document.getElementById('modal-title').innerText = "➕ 新增全新員工檔案";
                document.getElementById('form-empId').readOnly = false;
                document.getElementById('form-empId').className = "w-full border border-gray-200 rounded-xl px-3 py-2 focus:border-indigo-500";
                document.getElementById('form-arrivalDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('pwd-hint').innerText = "";
                document.getElementById('form-password').setAttribute('required', '');
                // 清除工號重複提示
                const msg = document.getElementById('empId-check-msg');
                msg.innerText = ""; msg.classList.add('hidden');
            }
            modal.classList.remove('hidden');
        }

        function submitHRForm(event) {
            event.preventDefault();
            
            const empId = document.getElementById('form-empId').value.trim();
            // 新增模式：阻擋重複工號
            if (!document.getElementById('form-empId').readOnly) {
                const duplicate = hrProfilesData.find(e => e.empId.replace(/^'/, '').trim() === empId);
                if (duplicate) {
                    alert(`⚠️ 工號「${empId}」已被「${duplicate.name}」使用，請重新輸入。`);
                    document.getElementById('form-empId').focus();
                    return;
                }
            }

            const empData = {
                empId:       empId,
                name:        document.getElementById('form-name').value.trim(),
                dept:        document.getElementById('form-dept').value.trim(),
                title:       document.getElementById('form-title').value.trim(),
                arrivalDate: document.getElementById('form-arrivalDate').value,
                phone:       document.getElementById('form-phone').value.trim() || "無",
                branch:      document.getElementById('form-branch').value.trim(),
                salary:      document.getElementById('form-salary').value.trim(),
                birthday:    document.getElementById('form-birthday').value,
                email:       document.getElementById('form-email').value.trim(),
                lineUid:     document.getElementById('form-lineUid').value.trim(),
                password:    document.getElementById('form-password').value.trim(),
                status:      document.getElementById('form-status').value,
                role:        document.getElementById('form-role').value
            };

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "saveHRProfile", lineUid: currentAdminLineUid, empData: empData })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert("員工檔案儲存成功！");
                    closeHRModal();
                    forcedFreshLoadHRProfiles();
                } else { alert("儲存失敗：" + res.message); }
            });
        }

        function deleteHRProfile(empId, name) {
            if (!confirm(`⚠️ 確定要刪除員工【${name} (工號: ${empId})】嗎？`)) return;

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteHRProfile", lineUid: currentAdminLineUid, empId: empId })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert("已成功刪除員工資料！");
                    forcedFreshLoadHRProfiles(); 
                } else { alert("刪除失敗：" + res.message); }
            });
        }

        function loadPendingForms() {
            const tbody = document.getElementById('pending-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-400">載入中...</td></tr>`;
            const url = `${GAS_WEB_APP_URL}?action=getPendingForms&lineUid=${encodeURIComponent(currentAdminLineUid)}&_t=${new Date().getTime()}`;
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    tbody.innerHTML = "";

                    // 依所別過濾（查 hrProfilesData 的 branch 欄位）
                    const pendingVisible = currentAdminBranch
                        ? res.data.filter(f => {
                            const emp = hrProfilesData.find(e => e.empId === f.empId);
                            return emp && emp.branch === currentAdminBranch;
                          })
                        : res.data;

                    if (res.status !== "success" || pendingVisible.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-gray-400">目前無待審核單據</td></tr>`;
                        return;
                    }
                    pendingVisible.forEach(form => {
                        const categoryBadge = form.category === "加班"
                            ? `<span class="bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded text-xs font-medium">加班</span>`
                            : `<span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-xs font-medium">請假</span>`;
                        const timeInfo = `${form.subType} | ${form.startTime} ~ ${form.endTime} | ${form.totalHours}小時`;
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50 border-b border-gray-50">
                                <td class="p-3 font-medium">${form.name}<br><span class="text-xs text-gray-400">${form.empId}</span></td>
                                <td class="p-3">${categoryBadge}</td>
                                <td class="p-3 text-xs text-gray-600">${timeInfo}</td>
                                <td class="p-3 text-xs text-gray-600">${form.reason || '-'}</td>
                                <td class="p-3 text-center">
                                    <button onclick="executeReview('${form.formId}','已核准','${form.category}')" class="bg-green-600 hover:bg-green-700 text-white px-2.5 py-1.5 rounded-lg mr-1 text-xs font-medium">✓ 准許</button>
                                    <button onclick="executeReview('${form.formId}','已拒絕','${form.category}')" class="bg-red-600 hover:bg-red-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-medium">✗ 駁回</button>
                                </td>
                            </tr>`;
                    });
                })
                .catch(err => {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center p-4 text-red-400">載入失敗：${err}</td></tr>`;
                });
        }

        function executeReview(formId, decision, category) {
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ action: "reviewForm", lineUid: currentAdminLineUid, formId: formId, statusResult: decision, category: category })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert(`審核完成：${decision}`);
                    loadPendingForms();
                } else {
                    alert("審核失敗：" + (res.message || "請確認管理員權限是否已正確設定"));
                }
            })
            .catch(err => alert("連線錯誤：" + err));
        }

        let allAttendanceLogs = []; // 全域快取，供篩選與匯出使用

        function loadAttendanceReports() {
            const tbody = document.getElementById('report-table-body');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center p-4 text-gray-400">載入中...</td></tr>`;
            const url = `${GAS_WEB_APP_URL}?action=getAttendanceReports&lineUid=${encodeURIComponent(currentAdminLineUid)}&_t=${new Date().getTime()}`;
            fetch(url).then(res => res.json()).then(res => {
                if (res.status === "success") {
                    // 依所別過濾後存入全域快取
                    allAttendanceLogs = currentAdminBranch
                        ? res.data.filter(log => {
                            const emp = hrProfilesData.find(e => e.empId === log.empId);
                            return emp && emp.branch === currentAdminBranch;
                          })
                        : res.data;

                    // 更新員工下拉選單（以同所別的員工檔案為主，而非只看已有打卡紀錄的人）
                    const empSelect = document.getElementById('report-filter-emp');
                    const prevEmp = empSelect.value;
                    const branchEmps = currentAdminBranch
                        ? hrProfilesData.filter(e => e.branch === currentAdminBranch)
                        : hrProfilesData;
                    empSelect.innerHTML = '<option value="">全部員工</option>';
                    branchEmps
                        .slice()
                        .sort((a, b) => a.empId.localeCompare(b.empId))
                        .forEach(emp => {
                            empSelect.innerHTML += `<option value="${emp.empId}">${emp.name}（${emp.empId}）</option>`;
                        });
                    empSelect.value = prevEmp;

                    renderReportTable(allAttendanceLogs);
                }
            });
        }

        function formatDateROC(dateStr) {
            const dp = (dateStr || '').split('/');
            if (dp.length === 3) {
                const rocYear = parseInt(dp[0]) - 1911;
                return `${rocYear}年${parseInt(dp[1])}月${parseInt(dp[2])}日`;
            }
            return dateStr;
        }

        function formatTimeAMPM(timeStr) {
            const tp = (timeStr || '').split(':');
            if (tp.length >= 2) {
                let h = parseInt(tp[0]);
                const m = tp[1].padStart(2, '0');
                const ampm = h < 12 ? '上午' : '下午';
                if (h === 0) h = 12;
                else if (h > 12) h -= 12;
                return `${ampm}${h}：${m}`;
            }
            return timeStr;
        }

        function renderReportTable(logs) {
            const tbody = document.getElementById('report-table-body');
            const countEl = document.getElementById('report-count');
            tbody.innerHTML = "";
            if (!logs || logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-4 text-gray-400">無符合條件的打卡紀錄</td></tr>`;
                countEl.innerText = "";
                return;
            }
            countEl.innerText = `共 ${logs.length} 筆`;
            logs.forEach(log => {
                tbody.innerHTML += `<tr class="border-b border-gray-50">
                    <td class="p-3 font-mono text-xs">${log.empId}</td>
                    <td class="p-3">${log.name}</td>
                    <td class="p-3">${formatDateROC(log.date)}</td>
                    <td class="p-3 font-bold">${formatTimeAMPM(log.time)}</td>
                    <td class="p-3">${log.type}</td>
                    <td class="p-3 text-gray-400 text-xs">${log.memo || '-'}</td>
                </tr>`;
            });
        }

        function applyReportFilter() {
            const empId     = document.getElementById('report-filter-emp').value;
            const startVal  = document.getElementById('report-filter-start').value;  // yyyy-MM-dd
            const endVal    = document.getElementById('report-filter-end').value;

            const filtered = allAttendanceLogs.filter(log => {
                // 員工篩選
                if (empId && log.empId !== empId) return false;
                // 日期篩選：log.date 格式為 "yyyy/MM/dd"
                if (startVal || endVal) {
                    const logDate = (log.date || '').replace(/\//g, '-'); // 轉成 yyyy-MM-dd 比對
                    if (startVal && logDate < startVal) return false;
                    if (endVal   && logDate > endVal)   return false;
                }
                return true;
            });
            renderReportTable(filtered);
        }

        function resetReportFilter() {
            document.getElementById('report-filter-emp').value   = '';
            document.getElementById('report-filter-start').value = '';
            document.getElementById('report-filter-end').value   = '';
            renderReportTable(allAttendanceLogs);
        }

        function exportReportCSV() {
            // 取目前已顯示的行（與篩選後一致）
            const rows = document.querySelectorAll('#report-table-body tr');
            if (!rows.length || rows[0].cells.length < 2) { alert('目前沒有可匯出的資料'); return; }

            const headers = ['員工編號', '姓名', '打卡日期', '打卡時間', '打卡類型', '打卡備註說明'];
            let csv = '﻿' + headers.join(',') + '\n'; // BOM for Excel 正確顯示中文
            rows.forEach(row => {
                const cells = Array.from(row.cells).map(td => {
                    const text = td.innerText.trim().replace(/"/g, '""');
                    return `"${text}"`;
                });
                csv += cells.join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            const now  = new Date();
            const fname = `出勤紀錄_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.csv`;
            a.href = url; a.download = fname; a.click();
            URL.revokeObjectURL(url);
        }

        function checkEmpIdDuplicate() {
            // 編輯模式（readOnly）不需要檢查
            if (document.getElementById('form-empId').readOnly) return;
            const empId  = document.getElementById('form-empId').value.trim();
            const msgEl  = document.getElementById('empId-check-msg');
            if (!empId) { msgEl.classList.add('hidden'); return; }
            const exists = hrProfilesData.find(e => e.empId.replace(/^'/, '').trim() === empId);
            if (exists) {
                msgEl.innerText   = `⚠️ 工號「${empId}」已被「${exists.name}」使用`;
                msgEl.className   = 'text-xs mt-1 text-red-500';
                msgEl.classList.remove('hidden');
            } else {
                msgEl.innerText   = `✓ 工號可使用`;
                msgEl.className   = 'text-xs mt-1 text-emerald-600';
                msgEl.classList.remove('hidden');
            }
        }

        function closeHRModal() { document.getElementById('hr-modal').classList.add('hidden'); }
        function copyLiffUrl() { navigator.clipboard.writeText(SYSTEM_ENV.LIFF_URL).then(() => alert("專屬 LIFF 網址已複製！")); }
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.className = "tab-btn text-gray-600 px-4 py-2 text-sm font-medium");
            document.getElementById('btn-' + id).className = "tab-btn bg-white text-gray-800 px-4 py-2 rounded-lg text-sm font-medium shadow-sm shadow-gray-200";
        }
    </script>
    <div id="appVersion" class="fixed bottom-2 right-3 text-[10px] text-gray-300 select-none z-50"></div>

    <script>
        document.getElementById('appVersion').innerText = (typeof APP_VERSION !== 'undefined') ? APP_VERSION : '';
    </script>
