<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端人事後台管理系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f9fafb; }
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        th, td { white-space: nowrap; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-200 pb-4 mb-6 gap-2">
            <div>
                <h1 class="text-2xl font-bold text-gray-800"><i class="fa-solid : fa-user-shield text-indigo-600 mr-2"></i>待審核表單中心</h1>
                <p class="text-sm text-gray-500 mt-1">權限角色：<span id="admin-role-tag" class="bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded text-xs font-semibold">驗證中...</span></p>
            </div>
            <div class="text-right">
                <span id="current-time-clock" class="text-sm font-mono text-gray-500 bg-white px-3 py-1.5 rounded-lg shadow-sm border border-gray-100"></span>
            </div>
        </div>

        <div class="flex space-x-2 mb-6 bg-gray-100 p-1 rounded-xl w-fit">
            <button onclick="switchTab('pending-section')" id="btn-pending-section" class="tab-btn bg-white text-gray-800 px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition-all">
                <i class="fa-solid fa-file-signature mr-1"></i>待審核單據
            </button>
            <button onclick="switchTab('hr-section')" id="btn-hr-section" class="tab-btn text-gray-600 hover:text-gray-900 px-4 py-2 rounded-lg text-sm font-medium transition-all">
                <i class="fa-solid fa-users-gear mr-1"></i>人事檔案維護
            </button>
            <button onclick="switchTab('report-section')" id="btn-report-section" class="tab-btn text-gray-600 hover:text-gray-900 px-4 py-2 rounded-lg text-sm font-medium transition-all">
                <i class="fa-solid fa-business-time mr-1"></i>歷史出勤報表
            </button>
        </div>

        <div id="pending-section" class="tab-content bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">即時待審名單</h2>
                <button onclick="loadPendingForms()" class="text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-lg font-medium transition-all">
                    <i class="fa-solid fa-rotate mr-1"></i>重新整理
                </button>
            </div>
            
            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm font-semibold border-b border-gray-100">
                            <th class="p-3">申請人</th>
                            <th class="p-3">表單類型</th>
                            <th class="p-3">詳細時間與時數</th>
                            <th class="p-3">事由 / 備註</th>
                            <th class="p-3 text-center">審核決策</th>
                        </tr>
                    </thead>
                    <tbody id="pending-table-body" class="text-gray-700 text-sm divide-y divide-gray-50">
                        <tr>
                            <td colspan="5" class="text-center p-8 text-gray-400">正在安全連線至 Google 試算表載入資料...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="hr-section" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                <h2 class="text-lg font-bold text-gray-700">全體員工清單</h2>
                <button onclick="openHREditModal()" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded-xl font-medium transition-all shadow-sm shadow-green-100">
                    <i class="fa-solid fa-user-plus mr-1"></i>新增員工檔案
                </button>
            </div>

            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm font-semibold border-b border-gray-100">
                            <th class="p-3">工號/姓名</th>
                            <th class="p-3">部門/職稱</th>
                            <th class="p-3">聯絡電話</th>
                            <th class="p-3">LINE UID (系統綁定憑證)</th>
                            <th class="p-3">狀態/權限</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="hr-table-body" class="text-gray-700 text-sm divide-y divide-gray-50">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="report-section" class="tab-content hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-4 md:p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-700">全體歷史打卡追蹤</h2>
                <button onclick="loadAttendanceReports()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg font-medium transition-all">
                    <i class="fa-solid fa-arrow-down-9-1 mr-1"></i>最新紀錄在前
                </button>
            </div>

            <div class="table-container">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 text-sm font-semibold border-b border-gray-100">
                            <th class="p-3">員工編號</th>
                            <th class="p-3">姓名</th>
                            <th class="p-3">打卡日期</th>
                            <th class="p-3">打卡時間</th>
                            <th class="p-3">打卡類型</th>
                            <th class="p-3">打卡備註說明</th>
                        </tr>
                    </thead>
                    <tbody id="report-table-body" class="text-gray-700 text-sm divide-y divide-gray-50">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <div id="hr-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 animate-in fade-in zoom-in-95 duration-150">
            <h3 id="modal-title" class="text-lg font-bold text-gray-800 mb-4">編輯員工資料</h3>
            <form id="hr-form" onsubmit="submitHRForm(event)" class="space-y-3 text-sm">
                <div>
                    <label class="block text-gray-600 mb-1 font-medium">員工編號 (不可重複)</label>
                    <input type="text" id="form-empId" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">姓名</label>
                        <input type="text" id="form-name" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">部門</label>
                        <input type="text" id="form-dept" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">職稱</label>
                        <input type="text" id="form-title" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">到職日期</label>
                        <input type="date" id="form-arrivalDate" required class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-600 mb-1 font-medium">聯絡電話</label>
                    <input type="tel" id="form-phone" class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-gray-600 mb-1 font-medium">LINE User ID (綁定身分用)</label>
                    <input type="text" id="form-lineUid" required class="w-full border border-gray-200 rounded-xl px-3 py-2 font-mono text-xs focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">在職狀態</label>
                        <select id="form-status" class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                            <option value="在職">在職</option>
                            <option value="離職">離職</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-600 mb-1 font-medium">系統權限設定</label>
                        <select id="form-role" class="w-full border border-gray-200 rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                            <option value="User">User (一般員工)</option>
                            <option value="Admin">Admin (後台管理員)</option>
                        </select>
                    </div>
                </div>
                <div class="flex space-x-2 pt-4 justify-end">
                    <button type="button" onclick="closeHRModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-4 py-2 rounded-xl transition-all">取消</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl transition-all shadow-md shadow-indigo-100">儲存人事檔案</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ 請在此處填入您部署成功的 Google Apps Script Web App 網址
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw8v_f2uaIlLnhr8jZQE5X91gxvrla0urOOA-nUcR46BrKlBaJ19lB_-1U-uMqotNsD/exec"; 
        
        // 測試用專用 LINE UID（正式上線時，此處會由 LIFF 自動取得傳入）
        const MOCK_LINE_UID = "填入你的LINE_UID_測試用"; 

        // 頁面初始化
        window.onload = function() {
            // 每秒更新時鐘
            setInterval(() => {
                const now = new Date();
                document.getElementById('current-time-clock').innerText = "⏱️ 系統時間：" + now.toLocaleString('zh-TW', {hour12:false});
            }, 1000);

            // 啟動身分驗證並載入資料
            verifyAdminIdentity();
        };

        // 1. 驗證管理員身分
        function verifyAdminIdentity() {
            const url = `${GAS_WEB_APP_URL}?action=verifyLogin&lineUid=${encodeURIComponent(MOCK_LINE_UID)}`;
            
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success" && res.data.role === "Admin") {
                        document.getElementById('admin-role-tag').innerText = `最高管理員 - ${res.data.name}`;
                        document.getElementById('admin-role-tag').className = "bg-green-100 text-green-800 px-2 py-0.5 rounded text-xs font-semibold";
                        // 驗證成功後載入所有分頁數據
                        loadPendingForms();
                        loadHRProfiles();
                        loadAttendanceReports();
                    } else {
                        alert("🛑 權限拒絕：系統偵測到您不具備 Admin 管理員權限，或尚未綁定此 LINE UID。");
                        document.body.innerHTML = `<div class="text-center p-20 text-red-600 font-bold text-xl">❌ 安全攔截：您無權存取人事管理後台。</div>`;
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("連線後端 API 失敗，請確認 GAS_WEB_APP_URL 是否填寫正確，且已發布新版本！");
                });
        }

        // 💡 關鍵優化：專門將 ISO 格式時間（2026-06-12T15:53:00.000Z）優雅轉換為在地格式的函式
        function formatDateTimeString(dateStr) {
            if (!dateStr) return "";
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr; // 如果本來就是純文字就直接回傳
                
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                
                return `${yyyy}-${mm}-${dd} ${hh}:${hh === '00' && min === '00' ? '00' : min}`;
            } catch (e) {
                return dateStr;
            }
        }

        // 2. 載入待審核單據
        function loadPendingForms() {
            const tbody = document.getElementById('pending-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-gray-400"><i class="fa-solid fa-spinner animate-spin mr-2"></i>更新資料中...</td></tr>`;

            const url = `${GAS_WEB_APP_URL}?action=getPendingForms&lineUid=${encodeURIComponent(MOCK_LINE_UID)}`;
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        if (res.data.length === 0) {
                            tbody.innerHTML = `<tr><td colspan="5" class="text-center p-8 text-gray-400">🎉 目前沒有任何待審核的請假或加班申請！</td></tr>`;
                            return;
                        }
                        tbody.innerHTML = "";
                        res.data.forEach(form => {
                            tbody.innerHTML += `
                                <tr class="hover:bg-gray-50/80 transition-colors">
                                    <td class="p-3 font-medium text-gray-900">${form.name}<br><span class="text-xs text-gray-400 font-mono">${form.empId}</span></td>
                                    <td class="p-3"><span class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-md font-semibold">${form.formType}(${form.subType})</span></td>
                                    <td class="p-3 text-xs leading-relaxed text-gray-600">
                                        <span class="text-gray-400">起：</span>${formatDateTimeString(form.startTime)}<br>
                                        <span class="text-gray-400">迄：</span>${formatDateTimeString(form.endTime)}<br>
                                        <span class="text-indigo-600 font-bold">⏱️ 合計 ${form.totalHours} 小時</span>
                                    </td>
                                    <td class="p-3 max-w-xs truncate text-gray-500" title="${form.reason}">${form.reason || '無'}</td>
                                    <td class="p-3 text-center space-x-1">
                                        <button onclick="executeReview('${form.formId}', '已核准')" class="bg-green-600 hover:bg-green-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium transition-all"><i class="fa-solid fa-check mr-1"></i>准許</button>
                                        <button onclick="executeReview('${form.formId}', '已拒絕')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2.5 py-1.5 rounded-lg font-medium transition-all"><i class="fa-solid fa-xmark mr-1"></i>駁回</button>
                                    </td>
                                </tr>
                            `;
                        });
                    }
                });
        }

        // 3. 執行審核動作 (核准/駁回)
        function executeReview(formId, decision) {
            if (!confirm(`確定要將此單據設定為【${decision}】嗎？`)) return;

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "reviewForm",
                    lineUid: MOCK_LINE_UID,
                    formId: formId,
                    statusResult: decision
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert(`單據 ${formId} 已成功改為：${decision}`);
                    loadPendingForms(); // 重新整理
                } else {
                    alert("審核失敗：" + res.message);
                }
            });
        }

        // 4. 載入人事檔案
        let hrProfilesData = []; // 快取人事資料
        function loadHRProfiles() {
            const tbody = document.getElementById('hr-table-body');
            const url = `${GAS_WEB_APP_URL}?action=getHRProfiles&lineUid=${encodeURIComponent(MOCK_LINE_UID)}`;
            
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        hrProfilesData = res.data;
                        tbody.innerHTML = "";
                        res.data.forEach(emp => {
                            const statusColor = emp.status === "在職" ? "bg-green-100 text-green-800" : "bg-red-100 text-red-800";
                            const roleColor = emp.role === "Admin" ? "bg-purple-100 text-purple-800" : "bg-gray-100 text-gray-800";
                            
                            tbody.innerHTML += `
                                <tr class="hover:bg-gray-50/80 transition-colors">
                                    <td class="p-3 font-semibold text-gray-800">${emp.name}<br><span class="text-xs text-gray-400 font-mono">${emp.empId}</span></td>
                                    <td class="p-3 text-sm text-gray-600">${emp.dept}<br><span class="text-xs text-gray-500">${emp.title}</span></td>
                                    <td class="p-3 font-mono text-xs text-gray-600">${emp.phone || '無'}</td>
                                    <td class="p-3 font-mono text-xs text-gray-400 select-all" title="雙擊可全選複製">${emp.lineUid}</td>
                                    <td class="p-3 space-y-1">
                                        <span class="${statusColor} text-xs px-2 py-0.5 rounded-md font-medium block w-fit">${emp.status}</span>
                                        <span class="${roleColor} text-xs px-2 py-0.5 rounded-md font-medium block w-fit">${emp.role}</span>
                                    </td>
                                    <td class="p-3 text-center">
                                        <button onclick="openHREditModal('${emp.empId}')" class="text-indigo-600 hover:text-indigo-900 text-xs font-medium bg-indigo-50 hover:bg-indigo-100 px-2 py-1 rounded-md transition-all"><i class="fa-solid fa-user-pen mr-1"></i>編輯</button>
                                    </td>
                                </tr>
                            `;
                        });
                    }
                });
        }

        // 5. 開啟/新增人事檔案視窗
        function openHREditModal(empId = null) {
            const modal = document.getElementById('hr-modal');
            const form = document.getElementById('hr-form');
            form.reset();

            if (empId) {
                document.getElementById('modal-title').innerText = "📝 編輯員工檔案";
                document.getElementById('form-empId').readOnly = true;
                document.getElementById('form-empId').className = "w-full border border-gray-200 bg-gray-50 text-gray-400 rounded-xl px-3 py-2 font-mono focus:outline-none";
                
                // 填入既有舊資料
                const emp = hrProfilesData.find(e => e.empId === empId);
                if (emp) {
                    document.getElementById('form-empId').value = emp.empId;
                    document.getElementById('form-name').value = emp.name;
                    document.getElementById('form-dept').value = emp.dept;
                    document.getElementById('form-title').value = emp.title;
                    document.getElementById('form-arrivalDate').value = emp.arrivalDate;
                    document.getElementById('form-phone').value = emp.phone;
                    document.getElementById('form-lineUid').value = emp.lineUid;
                    document.getElementById('form-status').value = emp.status;
                    document.getElementById('form-role').value = emp.role;
                }
            } else {
                document.getElementById('modal-title').innerText = "➕ 新增全新員工檔案";
                document.getElementById('form-empId').readOnly = false;
                document.getElementById('form-empId').className = "w-full border border-gray-200 rounded-xl px-3 py-2 font-mono focus:outline-none focus:border-indigo-500";
                document.getElementById('form-arrivalDate').value = new Date().toISOString().split('T')[0];
            }
            modal.classList.remove('hidden');
        }

        function closeHRModal() {
            document.getElementById('hr-modal').classList.add('hidden');
        }

        // 6. 送出儲存人事檔案
        function submitHRForm(event) {
            event.preventDefault();
            
            const empData = {
                empId: document.getElementById('form-empId').value.trim(),
                name: document.getElementById('form-name').value.trim(),
                dept: document.getElementById('form-dept').value.trim(),
                title: document.getElementById('form-title').value.trim(),
                arrivalDate: document.getElementById('form-arrivalDate').value,
                phone: document.getElementById('form-phone').value.trim(),
                lineUid: document.getElementById('form-lineUid').value.trim(),
                status: document.getElementById('form-status').value,
                role: document.getElementById('form-role').value
            };

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "saveHRProfile",
                    lineUid: MOCK_LINE_UID,
                    empData: empData
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === "success") {
                    alert("員工檔案同步至試算表成功！");
                    closeHRModal();
                    loadHRProfiles(); // 重新刷清單
                } else {
                    alert("儲存失敗：" + res.message);
                }
            });
        }

        // 7. 載入歷史出勤紀錄
        function loadAttendanceReports() {
            const tbody = document.getElementById('report-table-body');
            const url = `${GAS_WEB_APP_URL}?action=getAttendanceReports&lineUid=${encodeURIComponent(MOCK_LINE_UID)}`;
            
            fetch(url)
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        tbody.innerHTML = "";
                        if (res.data.length === 0) {
                            tbody.innerHTML = `<tr><td colspan="6" class="text-center p-6 text-gray-400">目前尚無任何員工打卡數據。</td></tr>`;
                            return;
                        }
                        res.data.forEach(log => {
                            let typeBadge = "";
                            if (log.type === "上班") typeBadge = '<span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded font-semibold">上班</span>';
                            else if (log.type === "下班") typeBadge = '<span class="bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded font-semibold">下班</span>';
                            else typeBadge = `<span class="bg-purple-100 text-purple-800 text-xs px-2 py-0.5 rounded font-semibold">${log.type}</span>`;

                            tbody.innerHTML += `
                                <tr class="hover:bg-gray-50/60 transition-colors">
                                    <td class="p-3 font-mono text-gray-500">${log.empId}</td>
                                    <td class="p-3 font-medium text-gray-800">${log.name}</td>
                                    <td class="p-3 font-mono text-gray-600">${formatDateTimeString(log.date)}</td>
                                    <td class="p-3 font-mono text-gray-600 font-bold">${log.time}</td>
                                    <td class="p-3">${typeBadge}</td>
                                    <td class="p-3 text-xs text-gray-400 max-w-xs truncate" title="${log.memo}">${log.memo || '-'}</td>
                                </tr>
                            `;
                        });
                    }
                });
        }

        // UI 共用分頁切換
        function switchTab(targetSectionId) {
            document.querySelectorAll('.tab-content').forEach(section => section.classList.add('hidden'));
            document.getElementById(targetSectionId).classList.remove('hidden');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn text-gray-600 hover:text-gray-900 px-4 py-2 rounded-lg text-sm font-medium transition-all";
            });
            document.getElementById('btn-' + targetSectionId).className = "tab-btn bg-white text-gray-800 px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition-all";
        }
    </script>
</body>
</html>
