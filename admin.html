<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人事後台管理系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 頂部功能切換列 -->
    <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between shrink-0 shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-gears text-indigo-400 text-base"></i>
            <span class="font-bold tracking-wide text-sm">人事後台</span>
        </div>
        <div class="flex space-x-1.5">
            <button onclick="switchTab('approval')" id="mbn-approval" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold transition">
                待審核 <span id="mbadge-count" class="bg-red-500 text-white px-1.5 py-0.2 rounded-full hidden text-[10px]">0</span>
            </button>
            <button onclick="switchTab('records')" id="mbn-records" class="px-3 py-2 rounded-xl bg-slate-800 text-slate-400 text-xs font-medium transition">
                出勤報表
            </button>
        </div>
    </div>

    <!-- 標題數據列 -->
    <header class="bg-white border-b border-gray-200 py-3 px-4 flex items-center justify-between shrink-0">
        <h1 class="font-black text-gray-800 text-base" id="current-title">待審核表單中心</h1>
        <span class="text-[11px] text-gray-400 font-mono" id="live-time">2026-06-13 00:00:00</span>
    </header>

    <!-- 主內容滾動區 -->
    <main class="flex-1 overflow-y-auto p-4 pb-12">
        
        <!-- 頁面 A：待審核表單 (徹底揚棄傳統表格，100% 採用響應式卡片) -->
        <section id="tab-approval" class="space-y-3">
            <div id="approval-list-container-mobile" class="space-y-3">
                <div class="text-center text-gray-400 py-12 bg-white rounded-2xl border border-gray-200">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>正在從雲端拉取申請單...
                </div>
            </div>
        </section>

        <!-- 頁面 B：出勤報表 -->
        <section id="tab-records" class="hidden space-y-3">
            <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm">
                <button onclick="loadAttendanceReports()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm transition">
                    <i class="fa-solid fa-magnifying-glass mr-1"></i>更新 / 載入出勤日誌
                </button>
            </div>
            
            <!-- 報表支援橫向滑動，防止欄位擠壓 -->
            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse text-xs min-w-[500px]">
                        <thead class="bg-gray-50 text-gray-500 font-bold border-b border-gray-200">
                            <tr>
                                <th class="p-3">姓名</th>
                                <th class="p-3">日期</th>
                                <th class="p-3">時間</th>
                                <th class="p-3">類型</th>
                                <th class="p-3">備註</th>
                            </tr>
                        </thead>
                        <tbody id="report-list-tbody" class="divide-y divide-gray-100 text-gray-700">
                            <tr><td colspan="5" class="p-4 text-center text-gray-400">尚未載入出勤數據。</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript 邏輯區 -->
    <script>
        // --- 1. 全域變數宣告 ---
        let GAS_WEB_APP_URL = "";
        const currentAdminName = "李四美"; 

        // --- 2. 網頁事件監聽 ---
        window.addEventListener('DOMContentLoaded', () => {
            startLiveTime();
            
            // 安全載入環境變數 env.txt
            fetch('env.txt')
                .then(response => {
                    if (!response.ok) throw new Error('找不到 env.txt 檔案');
                    return response.text();
                })
                .then(url => {
                    GAS_WEB_APP_URL = url.trim();
                    console.log("後台 GAS 網址加載成功:", GAS_WEB_APP_URL);
                    fetchPendingForms(); 
                })
                .catch(error => {
                    console.error("後台初始化失敗:", error);
                    document.getElementById('approval-list-container-mobile').innerHTML = `
                        <div class="p-4 text-center text-red-500 font-bold bg-white rounded-2xl border">
                            ⚠️ 錯誤：無法載入 env.txt 設定檔。
                        </div>`;
                });
        });

        // --- 3. 核心功能函式定義 ---
        function fetchPendingForms() {
            if (!GAS_WEB_APP_URL) return;
            const container = document.getElementById('approval-list-container-mobile');
            container.innerHTML = `
                <div class="text-center text-gray-400 py-12 bg-white rounded-2xl border border-gray-200">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>正在同步 Google 試算表資料...
                </div>`;

            fetch(`${GAS_WEB_APP_URL}?action=getPendingForms`)
            .then(response => response.json())
            .then(res => {
                if (res.status === "success") {
                    renderApprovalCards(res.data);
                } else {
                    container.innerHTML = `<div class="p-4 text-center text-red-500 bg-white border rounded-2xl">載入失敗：${res.message}</div>`;
                }
            })
            .catch(error => {
                console.error("撈取失敗:", error);
                container.innerHTML = `<div class="p-4 text-center text-red-500 bg-white border rounded-2xl">無法連線至雲端資料庫，請確認 GAS 是否成功發布。</div>`;
            });
        }

        // 全面卡片化渲染
        function renderApprovalCards(forms) {
            const container = document.getElementById('approval-list-container-mobile');
            const mBadge = document.getElementById('mbadge-count');
            
            if (!forms || forms.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 py-12 bg-white rounded-2xl border border-gray-200">
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-xl mx-auto mb-2">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <span class="text-sm font-bold text-gray-500">目前沒有待審核的表單！</span>
                    </div>`;
                mBadge.classList.add('hidden');
                return;
            }

            mBadge.innerText = forms.length;
            mBadge.classList.remove('hidden');

            let cardHtml = "";
            forms.forEach(form => {
                // 假別特殊標籤顏色
                const typeColor = form.formType === '請假' ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-purple-100 text-purple-800 border-purple-200';
                
                // 格式化時間字串，把怪異的 T 和 .000Z 濾掉，讓主管看得很舒服
                const cleanStart = form.startTime.replace("T", " ").replace(/\.\d+Z$/, "");
                const cleanEnd = form.endTime.replace("T", " ").replace(/\.\d+Z$/, "");

                cardHtml += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 space-y-3">
                        <!-- 卡片頭部：名字與假別 -->
                        <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                            <div>
                                <span class="text-base font-black text-gray-800">${form.name}</span>
                                <span class="text-xs text-gray-400 ml-1.5 font-mono">工號: ${form.empId}</span>
                            </div>
                            <span class="text-xs px-2.5 py-0.5 rounded-lg font-bold border ${typeColor}">
                                ${form.formType} · ${form.subType}
                            </span>
                        </div>

                        <!-- 卡片中部：詳細時間 -->
                        <div class="text-xs bg-gray-50 p-3 rounded-xl text-gray-600 space-y-1.5 font-sans">
                            <div class="flex"><span class="text-gray-400 shrink-0 w-12">始於：</span><span class="text-gray-800 font-medium">${cleanStart}</span></div>
                            <div class="flex"><span class="text-gray-400 shrink-0 w-12">迄於：</span><span class="text-gray-800 font-medium">${cleanEnd}</span></div>
                            <div class="flex items-center"><span class="text-gray-400 shrink-0 w-12">合計：</span><span class="text-indigo-600 font-extrabold text-sm font-mono">${form.totalHours} 小時</span></div>
                        </div>

                        <!-- 卡片事由 -->
                        <div class="bg-amber-50/40 p-2.5 rounded-xl border border-amber-100/60">
                            <p class="text-[11px] text-amber-600 font-bold mb-0.5"><i class="fa-solid fa-comment-dots mr-1"></i>事由 / 備註</p>
                            <p class="text-xs text-gray-700 leading-relaxed">${form.reason || '無填寫事由'}</p>
                        </div>

                        <!-- 卡片底部：大按鈕（絕對不會被切除！） -->
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="reviewForm('${form.formId}', '已拒絕')" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-2.5 rounded-xl text-xs border border-rose-200 active:scale-95 transition-all">
                                ❌ 拒絕申請
                            </button>
                            <button onclick="reviewForm('${form.formId}', '已核准')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow-sm active:scale-95 transition-all">
                                ➔ 准予核定
                            </button>
                        </div>
                    </div>`;
            });

            container.innerHTML = cardHtml;
        }

        function reviewForm(formId, statusResult) {
            if (!GAS_WEB_APP_URL) return;
            if (!confirm(`確定要批核此表單為 [${statusResult}] 嗎？`)) return;

            const payload = { action: "reviewForm", formId: formId, statusResult: statusResult, adminName: currentAdminName };

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert(`🎯 審核完畢：系統已成功標記為 [${statusResult}]`);
                fetchPendingForms();
            })
            .catch(error => {
                console.error("審核失敗:", error);
                alert("通訊失敗，請重試。");
            });
        }

        function loadAttendanceReports() {
            if (!GAS_WEB_APP_URL) return;
            const tbody = document.getElementById('report-list-tbody');
            tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>雲端日誌載入中...</td></tr>`;

            fetch(`${GAS_WEB_APP_URL}?action=getAttendanceReports`)
            .then(response => response.json())
            .then(res => {
                if (res.status === "success" && res.data.length > 0) {
                    let html = "";
                    res.data.forEach(log => {
                        const badgeColor = log.type === '上班' ? 'text-emerald-600 bg-emerald-50' : 'text-orange-600 bg-orange-50';
                        html += `
                            <tr class="hover:bg-gray-50/50">
                                <td class="p-3 font-bold text-gray-800">${log.name}</td>
                                <td class="p-3 text-gray-500">${log.date}</td>
                                <td class="p-3 font-mono font-bold text-gray-700">${log.time}</td>
                                <td class="p-3"><span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeColor}">${log.type}</span></td>
                                <td class="p-3 text-gray-400 text-[11px] max-w-[120px] truncate">${log.memo}</td>
                            </tr>`;
                    });
                    tbody.innerHTML = html;
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">目前尚無任何打卡明細。</td></tr>`;
                }
            })
            .catch(() => { tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">報表讀取失敗。</td></tr>`; });
        }

        function switchTab(tabId) {
            document.getElementById('tab-approval').classList.add('hidden');
            document.getElementById('tab-records').classList.add('hidden');
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            
            document.getElementById('mbn-approval').className = "px-3 py-2 rounded-xl text-xs font-bold transition " + (tabId === 'approval' ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-400");
            document.getElementById('mbn-records').className = "px-3 py-2 rounded-xl text-xs font-bold transition " + (tabId === 'records' ? "bg-indigo-600 text-white" : "bg-slate-800 text-slate-400");

            document.getElementById('current-title').innerText = tabId === 'approval' ? '待審核表單中心' : '出缺勤報表與統計';
            
            if (tabId === 'records') loadAttendanceReports();
        }

        function startLiveTime() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('live-time').innerText = now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.toTimeString().split(' ')[0];
            }, 1000);
        }
    </script>
</body>
</html>
